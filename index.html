<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공사관리 및 안전보건 통합시스템</title>
    <style>
        /* 기본 디자인 설정 */
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background-color: #f8f9fa; color: #333; }
        * { box-sizing: border-box; }
        
        /* 상단 헤더 영역 (다크 네이비) */
        .header { background-color: #0f172a; color: white; padding: 40px 20px; }
        .header-content { max-width: 1000px; margin: 0 auto; }
        .header h1 { margin: 0 0 10px 0; font-size: 28px; display: flex; align-items: center; gap: 10px; }
        .header p { margin: 0; color: #94a3b8; font-size: 15px; }

        /* 통합 관리 박스 */
        .admin-box { background-color: #1e293b; border-radius: 10px; padding: 20px; margin-top: 20px; border: 1px solid #334155; }
        .admin-box-title { color: #e2e8f0; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
        .btn-left { display: flex; gap: 10px; }
        
        /* 메인 컨텐츠 영역 */
        .main-content { max-width: 1000px; margin: -20px auto 40px; padding: 0 20px; position: relative; z-index: 10; }
        
        /* 섹션 카드 공통 디자인 */
        .section-card { background: white; border-radius: 15px; padding: 30px; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: #1e293b; }

        /* 로컬 데이터 등록 현황 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .grid-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; }
        .grid-title { font-size: 13px; color: #64748b; margin-bottom: 10px; font-weight: bold; }
        .grid-value { font-size: 24px; font-weight: bold; }
        .val-green { color: #10b981; }
        .val-red { color: #ef4444; }
        .val-yellow { color: #f59e0b; }
        .val-blue { color: #3b82f6; }
        .val-purple { color: #8b5cf6; }

        /* 워크플로우 리스트 */
        .workflow-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: 0.2s; }
        .workflow-item:hover { border-color: #cbd5e1; background-color: #f8fafc; }
        .wf-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .wf-icon-1 { background-color: #d1fae5; color: #10b981; }
        .wf-icon-2 { background-color: #fce7f3; color: #ec4899; }
        .wf-text h3 { margin: 0 0 5px 0; font-size: 18px; color: #1e293b; }
        .wf-text p { margin: 0; color: #64748b; font-size: 14px; }
        .wf-arrow { margin-left: auto; color: #94a3b8; font-size: 20px; }

        /* 버튼 디자인 */
        .btn { padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-orange { background-color: #f59e0b; color: white; }
        .btn-red-outline { background-color: transparent; border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <div id="securityGateway" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: 'Malgun Gothic', sans-serif;">
        
        <div id="gatewaySelect" style="text-align: center;">
            <h2 style="margin-bottom: 10px; font-size: 26px;">통합시스템 접근 승인</h2>
            <p style="color: #94a3b8; margin-bottom: 40px;">접속하실 업무 영역을 선택해 주십시오.</p>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button onclick="goToLogin()" style="padding: 25px 40px; font-size: 20px; border-radius: 12px; border: none; background: #2563eb; color: white; cursor: pointer; font-weight: bold; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">🏢 본사<br><span style="font-size:14px; font-weight:normal; display:block; margin-top:5px;">(경영관리)</span></button>
                <button onclick="enterSiteDirectly()" style="padding: 25px 40px; font-size: 20px; border-radius: 12px; border: none; background: #10b981; color: white; cursor: pointer; font-weight: bold; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">🚧 현장<br><span style="font-size:14px; font-weight:normal; display:block; margin-top:5px;">(안전보건)</span></button>
            </div>
        </div>

        <div id="gatewayLogin" style="display: none; text-align: center;">
            <h2 style="margin-bottom: 20px; font-size: 24px;">본사 관리자 인증</h2>
            <p style="color: #94a3b8; margin-bottom: 30px;">관리자 암호를 입력해 주십시오.</p>
            <input type="password" id="hqPassword" placeholder="암호 입력" style="padding: 15px; font-size: 16px; width: 280px; border-radius: 8px; border: none; margin-bottom: 15px; text-align: center;">
            <br>
            <button onclick="checkHqPassword()" style="padding: 15px 30px; font-size: 16px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; font-weight: bold; width: 280px; margin-bottom: 10px;">로그인</button>
            <br>
            <button onclick="backToSelect()" style="padding: 12px 30px; font-size: 14px; border-radius: 8px; border: none; background: #475569; color: white; cursor: pointer; width: 280px;">뒤로 가기</button>
            <p id="pwdError" style="color: #ef4444; margin-top: 15px; display: none; font-weight: bold;">암호가 일치하지 않습니다.</p>
        </div>
    </div>
    <div class="header">
        <div class="header-content">
            <h1>⛑️ 공사관리 및 안전보건 통합시스템 🪄</h1>
            <p>경영관리, 공사원가, 안전보건 직무 통합 PWA 포털</p>

            <div class="admin-box">
                <div class="admin-box-title">🗄️ 1~10번 앱 전체 데이터 통합 관리 (스토리지 연동)</div>
                <div class="btn-group">
                    <div class="btn-left">
                        <button class="btn btn-green">⬇️ 전체 백업 (다운로드)</button>
                        <button class="btn btn-orange">⬆️ 백업 파일 불러오기</button>
                    </div>
                    <button class="btn btn-red-outline">🗑️ 시스템 초기화</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="section-card">
            <div class="section-title">📊 로컬 데이터 등록 현황</div>
            <div class="grid-container">
                <div class="grid-item">
                    <div class="grid-title">1.관리현장</div>
                    <div class="grid-value val-green">1</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">2.협력업체</div>
                    <div class="grid-value val-red">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">3.순회점검</div>
                    <div class="grid-value val-red">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">4.위험성평가</div>
                    <div class="grid-value val-yellow">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">5.작업일보</div>
                    <div class="grid-value val-blue">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">6.원가/손익</div>
                    <div class="grid-value val-purple">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">7.장비점검</div>
                    <div class="grid-value val-blue">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">8.신규교육</div>
                    <div class="grid-value val-red">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">9.건강확인</div>
                    <div class="grid-value val-green">0</div>
                </div>
                <div class="grid-item">
                    <div class="grid-title">10.안전보건비</div>
                    <div class="grid-value val-blue">0</div>
                </div>
            </div>
        </div>
