<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>본사 통합 관리 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    :root{
        --s900:#0f172a;--s800:#1e293b;--s700:#334155;--s500:#64748b;--s300:#cbd5e1;--s200:#e2e8f0;--s100:#f1f5f9;--s50:#f8fafc;
        --blue:#0284c7;--indigo:#4f46e5;--amber:#f59e0b;--red:#ef4444;--green:#10b981;--teal:#14b8a6;--purple:#8b5cf6;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',sans-serif;}
    body{background:var(--s100);color:var(--s900);padding-bottom:60px;}
    .hdr{background:var(--s900);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .hdr i.logo{font-size:22px;color:var(--teal);}
    .hdr-title{font-size:19px;font-weight:700;flex:1;}
    .hdr .meta{font-size:12px;color:#94a3b8;}
    .back-btn{color:#fff;text-decoration:none;font-size:13px;background:#334155;padding:8px 14px;border-radius:6px;}
    .container{max-width:1280px;margin:0 auto;padding:20px;}

    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
    .toolbar select,.toolbar button{padding:9px 14px;border:1px solid var(--s300);border-radius:8px;font-size:13px;background:#fff;cursor:pointer;}
    .toolbar button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
    .toolbar button.ghost{background:#fff;color:var(--s700);}
    .toolbar .grow{flex:1;}
    .status{font-size:12px;color:var(--s500);display:flex;align-items:center;gap:6px;}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
    .dot.ok{background:var(--green);} .dot.err{background:var(--red);}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
    .kpi{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .kpi .label{font-size:12px;color:var(--s500);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .kpi .value{font-size:26px;font-weight:700;color:var(--s900);}
    .kpi .unit{font-size:13px;color:var(--s500);font-weight:600;margin-left:3px;}
    .kpi .sub{font-size:11px;color:var(--s500);margin-top:4px;}
    .kpi.accent-blue .value{color:var(--blue);} .kpi.accent-green .value{color:var(--green);}
    .kpi.accent-amber .value{color:var(--amber);} .kpi.accent-red .value{color:var(--red);}
    .kpi.accent-indigo .value{color:var(--indigo);} .kpi.accent-purple .value{color:var(--purple);}

    .panel{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .panel-title{font-size:15px;font-weight:700;color:var(--s800);margin-bottom:14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--s900);padding-bottom:10px;}
    .panel-title .spacer{flex:1;}
    .panel-title .mini{font-size:12px;color:var(--s500);font-weight:400;}

    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px;}
    th,td{border:1px solid var(--s200);padding:9px 11px;text-align:center;}
    th{background:var(--s50);font-weight:700;color:var(--s700);position:sticky;top:0;}
    td.left{text-align:left;} td.right{text-align:right;font-variant-numeric:tabular-nums;}
    tbody tr:hover{background:var(--s50);}
    .site-name{font-weight:700;color:var(--s800);}
    .bar{height:8px;background:var(--s200);border-radius:4px;overflow:hidden;min-width:80px;}
    .bar > span{display:block;height:100%;background:var(--blue);}
    .bar.warn > span{background:var(--amber);} .bar.over > span{background:var(--red);}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;}
    .pill.zero{background:var(--s100);color:var(--s500);}
    .pill.has{background:#e0f2fe;color:#0369a1;}
    .empty{text-align:center;color:#94a3b8;padding:30px;font-size:13px;}
    .legend{font-size:11px;color:var(--s500);margin-top:8px;}
    .err-box{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:14px;border-radius:10px;font-size:13px;line-height:1.6;display:none;}
</style>
</head>
<body>

<div class="hdr">
    <i class="fa-solid fa-chart-line logo"></i>
    <div class="hdr-title">본사 통합 관리 대시보드</div>
    <div class="meta" id="companyMeta">회사명 불러오는 중…</div>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> 홈으로</a>
</div>

<div class="container">
    <div class="toolbar">
        <select id="siteFilter"><option value="">전체 현장</option></select>
        <select id="monthFilter"><option value="">전체 기간</option></select>
        <div class="grow"></div>
        <div class="status"><span class="dot" id="connDot"></span><span id="connText">클라우드 연결 확인 중…</span></div>
        <button class="ghost" id="btnRefresh"><i class="fa-solid fa-rotate"></i> 새로고침</button>
        <button class="primary" id="btnExcel"><i class="fa-solid fa-file-excel"></i> 엑셀 내보내기</button>
        <button class="ghost" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> 관리자 로그아웃</button>
    </div>

    <div class="err-box" id="errBox"></div>

    <div class="cards" id="kpiCards"></div>

    <div class="panel">
        <div class="panel-title"><i class="fa-solid fa-building"></i> 현장별 활동 현황<span class="spacer"></span><span class="mini" id="siteCountMini"></span></div>
        <div class="table-wrap">
            <table id="siteTable">
                <thead>
                    <tr>
                        <th>현장</th><th>작업일보</th><th>안전순찰</th><th>위험성평가</th>
                        <th>건설기계</th><th>건강확인</th><th>안전관리비 집행</th><th>최근 활동</th>
                    </tr>
                </thead>
                <tbody id="siteTableBody"></tbody>
            </table>
        </div>
        <div class="legend">※ 각 숫자는 해당 현장에서 등록된 건수입니다. ‘안전관리비 집행’은 산업안전보건관리비 누계 집행액입니다.</div>
    </div>

    <div class="panel">
        <div class="panel-title"><i class="fa-solid fa-won-sign"></i> 현장별 원가 집행 현황 <span class="mini">(예산 대비 실행)</span><span class="spacer"></span></div>
        <div class="table-wrap">
            <table id="costTable">
                <thead>
                    <tr><th>현장</th><th>기준월</th><th class="right">예산(원)</th><th class="right">실행(원)</th><th class="right">잔액(원)</th><th>집행률</th></tr>
                </thead>
                <tbody id="costTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title"><i class="fa-solid fa-helmet-safety"></i> 산업안전보건관리비 집행 (현장별 9대 항목)<span class="spacer"></span></div>
        <div class="table-wrap">
            <table id="shTable">
                <thead>
                    <tr><th>현장</th><th class="right">계상액</th><th class="right">누계집행</th><th>사용률</th><th class="right">건수</th></tr>
                </thead>
                <tbody id="shTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-db.js"></script>
<script src="admin-auth.js"></script>
<script>
"use strict";

/* 대시보드는 읽기 전용. siteData 컬렉션 전체를 읽어 site×key 로 집계한다. */
var RAW = [];          // [{site, key, value(파싱됨), updatedAt}]
var COMPANY = "";

function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

/* ---- 1. Firestore 로드 ---- */
function loadAll(){
    setConn('load');
    if (typeof fsdb === 'undefined' || !fsdb){
        setConn('err');
        showErr("클라우드(Firebase)에 연결되어 있지 않습니다. firebase-db.js의 설정값(firebaseConfig)이 올바른지 확인하세요.");
        render();   // 빈 화면이라도 구성
        return;
    }
    fsdb.collection("siteData").get().then(function(qs){
        RAW = [];
        qs.forEach(function(doc){
            var d = doc.data(); if(!d) return;
            var v = d.value;
            try{ v = JSON.parse(d.value); }catch(e){ /* 문자열 그대로 */ }
            RAW.push({ site: d.site||'미지정', key: d.key||'', value: v, updatedAt: d.updatedAt||'' });
        });
        hideErr(); setConn('ok');
        buildFilters(); render();
    }).catch(function(e){
        setConn('err');
        showErr("데이터를 불러오지 못했습니다: " + (e && e.message ? e.message : e) +
                "<br>Firestore 보안 규칙(Rules)에서 siteData 읽기가 허용되어 있는지 확인하세요.");
        render();
    });
}

function setConn(s){
    var dot=document.getElementById('connDot'), t=document.getElementById('connText');
    dot.className='dot'+(s==='ok'?' ok':s==='err'?' err':'');
    t.textContent = s==='ok'?('연결됨 · 문서 '+RAW.length+'건'):s==='err'?'연결 오류':'클라우드 연결 확인 중…';
}
function showErr(html){ var b=document.getElementById('errBox'); b.innerHTML=html; b.style.display='block'; }
function hideErr(){ document.getElementById('errBox').style.display='none'; }

/* ---- 2. 필터 옵션 구성 ---- */
function buildFilters(){
    var sites = {}, months = {};
    RAW.forEach(function(r){
        sites[r.site]=1;
        var m = extractMonth(r);
        if(m) months[m]=1;
    });
    var sf=document.getElementById('siteFilter'); var mf=document.getElementById('monthFilter');
    sf.innerHTML='<option value="">전체 현장</option>'+Object.keys(sites).sort().map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
    mf.innerHTML='<option value="">전체 기간</option>'+Object.keys(months).sort().reverse().map(function(m){return '<option>'+esc(m)+'</option>';}).join('');
    // 회사명
    var c = RAW.find(function(r){ return r.key==='scdrs_company_name'; });
    COMPANY = c ? (typeof c.value==='string'?c.value:String(c.value)) : '';
    document.getElementById('companyMeta').textContent = COMPANY ? ('회사: '+COMPANY) : '회사명 미등록';
}

/* 문서에서 월(YYYY-MM) 추출 (작업일보·원가·안전관리비 등) */
function extractMonth(r){
    var k=r.key||'';
    var m = k.match(/(\d{4})[-_](\d{2})/);          // scdrs_cost_xxx_2026-06 등
    if(m) return m[1]+'-'+m[2];
    if(k.indexOf('health_check_')===0){ var d=k.substring(13); return d.substring(0,7); }
    if(r.value && r.value.date){ return String(r.value.date).substring(0,7); }
    if(r.value && r.value.savedAt){ return String(r.value.savedAt).substring(0,7); }
    if(r.updatedAt){ return String(r.updatedAt).substring(0,7); }
    return '';
}

/* 현재 필터를 통과하는지 */
function pass(r){
    var sf=document.getElementById('siteFilter').value;
    var mf=document.getElementById('monthFilter').value;
    if(sf && r.site!==sf) return false;
    if(mf && extractMonth(r)!==mf) return false;
    return true;
}

/* ---- 3. 렌더링 ---- */
function render(){
    var rows = RAW.filter(pass);
    renderKPI(rows);
    renderSiteTable(rows);
    renderCostTable(rows);
    renderShTable(rows);
}

/* key 분류 헬퍼 */
function isReport(k){ return /^scdrs_/.test(k) && !/^scdrs_(sites|partners|company_name|cost_|machinery_)/.test(k); }
function isCost(k){ return k.indexOf('scdrs_cost_')===0; }
function isMachinery(k){ return k.indexOf('scdrs_machinery_')===0; }
function isInsp(k){ return k.indexOf('safetyPatrol:insp:')===0; }
function isRisk(k){ return /^riskAssess:/.test(k) && k!=='riskAssess:settings'; }
function isHealth(k){ return k.indexOf('health_check_')===0; }
function isExpenses(k){ return k==='sh_expenses'; }

function renderKPI(rows){
    var reports=0, insp=0, risk=0, mach=0, health=0, partners=0;
    rows.forEach(function(r){
        if(isReport(r.key)) reports++;
        else if(isInsp(r.key)) insp++;
        else if(isRisk(r.key)) risk++;
        else if(isMachinery(r.key)) mach++;
        else if(isHealth(r.key)) health++;
    });
    // 등록 현장 수: scdrs_sites 배열 기준(현장 필터 적용 시 해당 현장만)
    var sf=document.getElementById('siteFilter').value;
    var siteCount;
    if(sf){ siteCount=1; }
    else {
        var sitesDoc = RAW.find(function(r){ return r.key==='scdrs_sites'; });
        siteCount = (sitesDoc && Array.isArray(sitesDoc.value)) ? sitesDoc.value.length : 0;
    }
    // 협력업체 수(전사 공통)
    var p = RAW.find(function(r){ return r.key==='scdrs_partners'; });
    partners = (p && Array.isArray(p.value)) ? p.value.length : 0;

    var cards=[
        {label:'<i class="fa-solid fa-building"></i> 등록 현장',  v:siteCount, cls:'accent-indigo'},
        {label:'<i class="fa-solid fa-handshake"></i> 협력업체', v:partners, cls:'accent-purple'},
        {label:'<i class="fa-solid fa-file-lines"></i> 작업일보', v:reports, cls:'accent-blue'},
        {label:'<i class="fa-solid fa-clipboard-check"></i> 안전순찰', v:insp, cls:'accent-green'},
        {label:'<i class="fa-solid fa-triangle-exclamation"></i> 위험성평가', v:risk, cls:'accent-amber'},
        {label:'<i class="fa-solid fa-truck"></i> 건설기계', v:mach, cls:'accent-blue'},
        {label:'<i class="fa-solid fa-heart-pulse"></i> 건강확인', v:health, cls:'accent-red'}
    ];
    document.getElementById('kpiCards').innerHTML = cards.map(function(c){
        return '<div class="kpi '+c.cls+'"><div class="label">'+c.label+'</div><div class="value">'+c.v+'</div></div>';
    }).join('');
}

function renderSiteTable(rows){
    var bySite={};
    function ensure(s){ if(!bySite[s]) bySite[s]={report:0,insp:0,risk:0,mach:0,health:0,sh:0,shCnt:0,last:''}; return bySite[s]; }
    rows.forEach(function(r){
        var o=ensure(r.site);
        if(isReport(r.key)) o.report++;
        else if(isInsp(r.key)) o.insp++;
        else if(isRisk(r.key)) o.risk++;
        else if(isMachinery(r.key)) o.mach++;
        else if(isHealth(r.key)) o.health++;
        else if(isExpenses(r.key) && Array.isArray(r.value)){
            r.value.forEach(function(e){ o.sh += (Number(e.amount)||0); o.shCnt++; });
        }
        if(r.updatedAt && r.updatedAt>o.last) o.last=r.updatedAt;
    });
    var sites=Object.keys(bySite).sort();
    var tb=document.getElementById('siteTableBody');
    document.getElementById('siteCountMini').textContent = sites.length ? (sites.length+'개 현장') : '';
    if(!sites.length){ tb.innerHTML='<tr><td colspan="8" class="empty">표시할 현장 데이터가 없습니다.</td></tr>'; return; }
    tb.innerHTML = sites.map(function(s){
        var o=bySite[s];
        function cell(n){ return '<td><span class="pill '+(n?'has':'zero')+'">'+n+'</span></td>'; }
        var last = o.last ? o.last.substring(0,10) : '-';
        return '<tr><td class="left site-name">'+esc(s)+'</td>'+
               cell(o.report)+cell(o.insp)+cell(o.risk)+cell(o.mach)+cell(o.health)+
               '<td class="right">'+(o.sh?won(o.sh)+'원':'<span class="pill zero">0</span>')+'</td>'+
               '<td>'+last+'</td></tr>';
    }).join('');
}

function renderCostTable(rows){
    var list=[];
    rows.forEach(function(r){
        if(!isCost(r.key)) return;
        var v=r.value||{};
        var cats=['mat','lab','exp','sub'], b=0, a=0;
        cats.forEach(function(c){ if(v[c]){ b+=Number(v[c].b)||0; a+=Number(v[c].a)||0; } });
        var m = (r.key.match(/(\d{4}-\d{2})/)||[])[1] || extractMonth(r);
        list.push({site:r.site, month:m||'-', b:b, a:a});
    });
    list.sort(function(x,y){ return (y.month+y.site).localeCompare(x.month+x.site); });
    var tb=document.getElementById('costTableBody');
    if(!list.length){ tb.innerHTML='<tr><td colspan="6" class="empty">등록된 원가 데이터가 없습니다.</td></tr>'; return; }
    tb.innerHTML=list.map(function(o){
        var bal=o.b-o.a, rate=o.b?Math.round(o.a/o.b*100):0;
        var cls = rate>100?'over':rate>=90?'warn':'';
        return '<tr><td class="left site-name">'+esc(o.site)+'</td><td>'+esc(o.month)+'</td>'+
               '<td class="right">'+won(o.b)+'</td><td class="right">'+won(o.a)+'</td>'+
               '<td class="right" style="color:'+(bal<0?'var(--red)':'inherit')+'">'+won(bal)+'</td>'+
               '<td><div class="bar '+cls+'"><span style="width:'+Math.min(rate,100)+'%"></span></div>'+
               '<span style="font-size:11px;color:var(--s500)">'+rate+'%</span></td></tr>';
    }).join('');
}

function renderShTable(rows){
    var bySite={};
    rows.forEach(function(r){
        if(isExpenses(r.key) && Array.isArray(r.value)){
            var o=bySite[r.site]||(bySite[r.site]={sum:0,cnt:0,budget:0});
            r.value.forEach(function(e){ o.sum+=(Number(e.amount)||0); o.cnt++; });
        }
        if(r.key==='sh_siteinfo' && r.value){
            var o2=bySite[r.site]||(bySite[r.site]={sum:0,cnt:0,budget:0});
            var bv=String(r.value.gjBudget||'').replace(/[^0-9]/g,'');
            if(bv) o2.budget=Number(bv);
        }
    });
    var sites=Object.keys(bySite).sort();
    var tb=document.getElementById('shTableBody');
    if(!sites.length){ tb.innerHTML='<tr><td colspan="5" class="empty">등록된 안전보건관리비 내역이 없습니다.</td></tr>'; return; }
    tb.innerHTML=sites.map(function(s){
        var o=bySite[s];
        var rate=o.budget?Math.round(o.sum/o.budget*100):0;
        var cls=rate>100?'over':rate>=70?'warn':'';
        return '<tr><td class="left site-name">'+esc(s)+'</td>'+
               '<td class="right">'+(o.budget?won(o.budget)+'원':'-')+'</td>'+
               '<td class="right">'+won(o.sum)+'원</td>'+
               '<td>'+(o.budget?'<div class="bar '+cls+'"><span style="width:'+Math.min(rate,100)+'%"></span></div><span style="font-size:11px;color:var(--s500)">'+rate+'%</span>':'-')+'</td>'+
               '<td class="right">'+o.cnt+'</td></tr>';
    }).join('');
}

/* ---- 4. 엑셀 내보내기 ---- */
function exportExcel(){
    var wb = XLSX.utils.book_new();
    var rows = RAW.filter(pass);

    // 시트1: 현장별 활동 요약
    var bySite={};
    function E(s){ if(!bySite[s]) bySite[s]={현장:s,작업일보:0,안전순찰:0,위험성평가:0,건설기계:0,건강확인:0,안전관리비집행액:0}; return bySite[s]; }
    rows.forEach(function(r){
        var o=E(r.site);
        if(isReport(r.key)) o.작업일보++;
        else if(isInsp(r.key)) o.안전순찰++;
        else if(isRisk(r.key)) o.위험성평가++;
        else if(isMachinery(r.key)) o.건설기계++;
        else if(isHealth(r.key)) o.건강확인++;
        else if(isExpenses(r.key)&&Array.isArray(r.value)) r.value.forEach(function(e){o.안전관리비집행액+=Number(e.amount)||0;});
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(bySite)), "현장별요약");

    // 시트2: 안전보건관리비 상세
    var sh=[];
    rows.forEach(function(r){
        if(isExpenses(r.key)&&Array.isArray(r.value)){
            r.value.forEach(function(e){
                sh.push({현장:r.site, 일자:e.date, 항목분류:e.catName, 세부내역:e.desc, 수량:e.qty, 금액:e.amount, 구분:e.isCustom?'수기':'고시'});
            });
        }
    });
    if(sh.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sh), "안전관리비상세");

    // 시트3: 원가
    var cost=[];
    rows.forEach(function(r){
        if(!isCost(r.key))return; var v=r.value||{};
        var m=(r.key.match(/(\d{4}-\d{2})/)||[])[1]||'';
        ['mat','lab','exp','sub'].forEach(function(c){
            if(v[c]) cost.push({현장:r.site,기준월:m,비목:({mat:'재료비',lab:'노무비',exp:'경비',sub:'외주비'})[c],예산:v[c].b,실행:v[c].a});
        });
    });
    if(cost.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cost), "원가집행");

    var today=new Date().toISOString().substring(0,10);
    XLSX.writeFile(wb, "본사통합대시보드_"+today+".xlsx");
}

/* ---- 5. 이벤트 바인딩 ---- */
/* 본사 관리자 전용 페이지 접근 가드 (암호 인증 기반) */
function showLockScreen(){
    document.body.innerHTML =
        '<div style="max-width:520px;margin:80px auto;padding:32px;text-align:center;font-family:Pretendard,sans-serif;">' +
        '<div style="font-size:46px;color:#ef4444;margin-bottom:16px;"><i class="fa-solid fa-lock"></i></div>' +
        '<h2 style="color:#0f172a;margin-bottom:12px;">본사 관리자 전용 페이지입니다</h2>' +
        '<p style="color:#64748b;line-height:1.7;margin-bottom:24px;">이 통합 대시보드는 본사 관리자 암호를 입력해야 열람할 수 있습니다.</p>' +
        '<button id="retryLogin" style="background:#0284c7;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;margin-right:8px;">암호 다시 입력</button>' +
        '<a href="index.html" style="display:inline-block;background:#64748b;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;">홈으로</a>' +
        '</div>';
    var btn = document.getElementById('retryLogin');
    if (btn) btn.addEventListener('click', function(){
        promptAdminLogin(function(ok){ if(ok) location.reload(); });
    });
}

function startDashboard(){
    document.getElementById('siteFilter').addEventListener('change', render);
    document.getElementById('monthFilter').addEventListener('change', render);
    document.getElementById('btnRefresh').addEventListener('click', loadAll);
    document.getElementById('btnExcel').addEventListener('click', exportExcel);
    var lo = document.getElementById('btnLogout');
    if (lo) lo.addEventListener('click', function(){
        if (confirm('이 기기의 관리자 인증을 해제할까요? 다음 접속 시 암호를 다시 입력해야 합니다.')) {
            adminLogout();
            location.href = 'index.html';
        }
    });
    loadAll();
}

window.addEventListener('DOMContentLoaded', function(){
    /* 이미 인증된 기기면 바로 시작 */
    if (typeof isAdminAuthed === 'function' && isAdminAuthed()) { startDashboard(); return; }
    /* 아니면 암호를 요구하고, 통과 시 시작 */
    if (typeof promptAdminLogin === 'function') {
        promptAdminLogin(function(ok){
            if (ok) startDashboard();
            else showLockScreen();
        });
    } else {
        showLockScreen();
    }
});
</script>
