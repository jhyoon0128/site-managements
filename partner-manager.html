<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCDRS - 협력업체 등록 및 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #1e293b; --secondary: #f8fafc; --accent: #3b82f6; --danger: #ef4444; --success: #10b981;
            --text-main: #334155; --border: #cbd5e1; --bg-main: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-main); padding: 20px; display: flex; justify-content: center; }

        .container {
            width: 100%; max-width: 1200px; background: #fff; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}
        .btn { padding: 9px 15px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-success { background: var(--success); color: white; }
        .btn-dark { background: var(--primary); color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn:hover { opacity: 0.8; }

        .section-title { font-size: 16px; font-weight: bold; color: var(--primary); margin: 25px 0 15px 0; border-left: 4px solid var(--accent); padding-left: 10px; background: #f1f5f9; padding-block: 8px; display: flex; justify-content: space-between; align-items: center; padding-right: 15px;}
        
        .type-selector { display: flex; gap: 20px; background: #f8fafc; padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        .type-selector label { font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--primary); }
        .type-selector input[type="radio"] { transform: scale(1.3); accent-color: var(--accent); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group.half { grid-column: span 2; }
        
        label { font-size: 13px; font-weight: 700; color: var(--text-main); }
        input[type="text"], input[type="date"], select, textarea {
            padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 100%;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

        .radio-group { display: flex; gap: 15px; align-items: center; height: 42px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
        .radio-item { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }

        .attach-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-left: 10px; display: none; }
        
        /* Search Bar */
        .search-box { display: flex; gap: 5px; align-items: center; }
        .search-box input { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; width: 250px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--primary); color: white; white-space: nowrap; }
        tr:hover { background: #f8fafc; }
        
        #status-msg { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: var(--primary); color: white; border-radius: 8px; display: none; z-index: 999; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            .btn-group, #status-msg, .form-grid, .type-selector, .search-box { display: none !important; }
            .header h1 { border-bottom: none; margin-bottom: 10px; }
            .header::after { content: " (등록 협력업체 전체 목록)"; font-size: 18px; }
            .section-title { background: transparent; padding: 0; border: none; margin-bottom: 5px; }
            table { border: 1px solid #000; font-size: 11px; }
            th, td { border: 1px solid #000; padding: 6px; color: #000; }
            th { background: #f1f5f9 !important; color: #000 !important; -webkit-print-color-adjust: exact; }
            td:last-child, th:last-child { display: none; } /* 인쇄시 관리(버튼) 열 숨김 */
        }
    </style>
</head>
<body>
<!-- ===== Firebase 클라우드 저장 연결 (전 페이지 공통) ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-db.js"></script>


<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-handshake"></i> 협력업체 등록 및 관리</h1>
        <div class="btn-group">
            <button class="btn btn-outline" onclick="location.href='index.html'"><i class="fa-solid fa-house"></i> 메인</button>
            <input type="file" id="excel-upload" accept=".csv, .xls, .xlsx" style="display:none;" onchange="importExcel(event)">
            <button class="btn btn-success" onclick="document.getElementById('excel-upload').click()"><i class="fa-solid fa-upload"></i> 엑셀 업로드</button>
            <button class="btn btn-success" onclick="exportExcel()"><i class="fa-solid fa-download"></i> 엑셀 다운로드</button>
            <button class="btn btn-dark" onclick="window.print()"><i class="fa-solid fa-print"></i> 대장 인쇄</button>
            
            <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none;">수정 취소</button>
            <button class="btn btn-primary" id="saveBtn" onclick="savePartner()"><i class="fa-solid fa-floppy-disk"></i> 저장 (신규등록)</button>
        </div>
    </div>

    <div class="type-selector">
        <label><input type="radio" name="partnerType" value="사업자등록번호 거래처" checked> 사업자등록번호 거래처</label>
        <label><input type="radio" name="partnerType" value="카드 등록 거래처"> 카드 등록 거래처</label>
    </div>

    <form id="partnerForm">
        <div class="form-grid">
            <div class="form-group">
                <label>거래처코드 (담당부서)</label>
                <select id="pCode">
                    <option value="경영관리팀 (1)">경영관리팀 (1)</option>
                    <option value="구매관리팀 (2)">구매관리팀 (2)</option>
                    <option value="견적팀 (3)">견적팀 (3)</option>
                    <option value="공사관리팀 (4)">공사관리팀 (4)</option>
                    <option value="외주관리팀 (5)">외주관리팀 (5)</option>
                    <option value="안전환경관리팀 (6)">안전환경관리팀 (6)</option>
                </select>
            </div>
            <div class="form-group"><label>거래처명</label><input type="text" id="pName" placeholder="협력업체 상호명"></div>
            <div class="form-group"><label>사업자등록번호</label><input type="text" id="pBizNo" placeholder="000-00-00000"></div>
            <div class="form-group"><label>대표자명</label><input type="text" id="pCeo"></div>

            <div class="form-group"><label>거래처 담당자명</label><input type="text" id="pContactName"></div>
            <div class="form-group"><label>담당자명 (당사)</label><input type="text" id="pManager"></div>
            <div class="form-group"><label>전화번호 (회사)</label><input type="text" id="pPhone"></div>
            <div class="form-group"><label>휴대폰번호</label><input type="text" id="pMobile"></div>
            
            <div class="form-group half"><label>이메일</label><input type="text" id="pEmail" placeholder="example@email.com"></div>
            <div class="form-group half"><label>주소</label><input type="text" id="pAddress" placeholder="상세 주소 입력"></div>

            <div class="form-group"><label>업태</label><input type="text" id="pBizType"></div>
            <div class="form-group"><label>종목</label><input type="text" id="pBizItem"></div>
            <div class="form-group"><label>거래은행</label><input type="text" id="pBank"></div>
            <div class="form-group"><label>계좌번호</label><input type="text" id="pAccount"></div>

            <div class="form-group">
                <label>구분</label>
                <select id="pCategory">
                    <option value="자재">자재</option>
                    <option value="회계">회계</option>
                    <option value="외주">외주</option>
                    <option value="경비">경비</option>
                    <option value="도급사">도급사</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>사용 여부</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="pUse" value="사용" checked> 사용</label>
                    <label class="radio-item"><input type="radio" name="pUse" value="미사용"> 미사용</label>
                </div>
            </div>

            <div class="form-group">
                <label>등록일</label>
                <input type="date" id="pDate">
            </div>

            <div class="form-group half">
                <label>협력업체 평가 (적격 수급인 평가)</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="pEval" value="유" onchange="toggleAttachBtn(true)"> 유 (평가완료)
                    </label>
                    <button type="button" class="attach-btn" id="attachBtn" onclick="document.getElementById('evalFile').click()">
                        <i class="fa-solid fa-paperclip"></i> 평가서 첨부
                    </button>
                    <input type="file" id="evalFile" style="display:none;" onchange="handleFileSelect(this)">
                    <span id="fileNameDisplay" style="font-size:11px; margin-left:5px; color:var(--accent);"></span>
                    
                    <label class="radio-item" style="margin-left:20px;">
                        <input type="radio" name="pEval" value="무(평가요망)" checked onchange="toggleAttachBtn(false)"> 무 (평가요망)
                    </label>
                </div>
            </div>

            <div class="form-group full">
                <label>메모 (현장 특이사항 등)</label>
                <textarea id="pMemo" rows="5" placeholder="최대 5줄 이상의 특이사항 및 메모를 입력할 수 있습니다."></textarea>
            </div>
        </div>
    </form>

    <div class="section-title">
        <span>등록된 협력업체 대장 (리스트)</span>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="거래처명, 사업자번호, 대표자 검색" onkeyup="if(event.keyCode==13) searchPartner()">
            <button class="btn btn-dark" style="padding: 6px 12px;" onclick="searchPartner()"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
        </div>
    </div>
    
    <div style="overflow-x: auto;">
        <table id="partnerTable">
            <thead>
                <tr>
                    <th>유형</th>
                    <th>거래처명</th>
                    <th>사업자번호</th>
                    <th>대표자</th>
                    <th>구분</th>
                    <th>담당부서</th>
                    <th>전화번호</th>
                    <th>평가여부</th>
                    <th>사용</th>
                    <th style="text-align: center;">관리</th>
                </tr>
            </thead>
            <tbody id="partnerListBody">
                </tbody>
        </table>
    </div>
</div>

<div id="status-msg">데이터가 처리되었습니다.</div>

<script>
    document.getElementById('pDate').value = new Date().toISOString().substring(0, 10);
    let tempFileName = "";
    let editingId = null; // 현재 수정 중인 업체의 ID를 기억하는 변수

    function showMsg(text) {
        const msg = document.getElementById('status-msg');
        msg.innerText = text;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    function toggleAttachBtn(show) {
        document.getElementById('attachBtn').style.display = show ? 'inline-block' : 'none';
        if(!show) {
            document.getElementById('fileNameDisplay').innerText = "";
            tempFileName = "";
        }
    }

    function handleFileSelect(input) {
        if(input.files.length > 0) {
            tempFileName = input.files[0].name;
            document.getElementById('fileNameDisplay').innerText = tempFileName;
        }
    }

    // ================= 1. 저장 및 수정 로직 =================
    function savePartner() {
        const name = document.getElementById('pName').value;
        const bizNo = document.getElementById('pBizNo').value;
        if(!name) { alert("거래처명은 필수 입력입니다."); return; }

        const partnerData = {
            type: document.querySelector('input[name="partnerType"]:checked').value,
            code: document.getElementById('pCode').value,
            name: name,
            bizNo: bizNo,
            ceo: document.getElementById('pCeo').value,
            contactName: document.getElementById('pContactName').value,
            manager: document.getElementById('pManager').value,
            phone: document.getElementById('pPhone').value,
            mobile: document.getElementById('pMobile').value,
            email: document.getElementById('pEmail').value,
            address: document.getElementById('pAddress').value,
            bizType: document.getElementById('pBizType').value,
            bizItem: document.getElementById('pBizItem').value,
            bank: document.getElementById('pBank').value,
            account: document.getElementById('pAccount').value,
            category: document.getElementById('pCategory').value,
            use: document.querySelector('input[name="pUse"]:checked').value,
            date: document.getElementById('pDate').value,
            eval: document.querySelector('input[name="pEval"]:checked').value + (tempFileName ? ` (${tempFileName})` : ''),
            memo: document.getElementById('pMemo').value
        };

        let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
        
        if (editingId) {
            // 수정 모드: 기존 데이터 덮어쓰기
            const index = partners.findIndex(p => p.id === editingId);
            if(index > -1) {
                partnerData.id = editingId; // 기존 ID 유지
                partners[index] = partnerData;
            }
            showMsg("협력업체 정보가 성공적으로 수정되었습니다.");
            cancelEdit(); // 수정 모드 해제
        } else {
            // 신규 등록 모드
            partnerData.id = Date.now();
            partners.push(partnerData);
            showMsg("신규 협력업체가 대장에 등록되었습니다.");
            document.getElementById('partnerForm').reset();
            document.getElementById('pDate').value = new Date().toISOString().substring(0, 10);
            toggleAttachBtn(false);
        }

        localStorage.setItem('scdrs_partners', JSON.stringify(partners));
        if (typeof dbSave === 'function') dbSave('scdrs_partners', partners);   // 클라우드 동시 저장
        renderPartners();
    }

    // ================= 2. 테이블 수정 버튼 클릭 시 =================
    function editPartner(id) {
        let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
        const p = partners.find(p => p.id === id);
        if(!p) return;

        editingId = id; // 수정 모드 진입
        
        // 데이터 폼에 채워넣기
        document.querySelector(`input[name="partnerType"][value="${p.type}"]`).checked = true;
        document.getElementById('pCode').value = p.code;
        document.getElementById('pName').value = p.name;
        document.getElementById('pBizNo').value = p.bizNo;
        document.getElementById('pCeo').value = p.ceo;
        document.getElementById('pContactName').value = p.contactName;
        document.getElementById('pManager').value = p.manager;
        document.getElementById('pPhone').value = p.phone;
        document.getElementById('pMobile').value = p.mobile;
        document.getElementById('pEmail').value = p.email;
        document.getElementById('pAddress').value = p.address;
        document.getElementById('pBizType').value = p.bizType;
        document.getElementById('pBizItem').value = p.bizItem;
        document.getElementById('pBank').value = p.bank;
        document.getElementById('pAccount').value = p.account;
        document.getElementById('pCategory').value = p.category;
        document.querySelector(`input[name="pUse"][value="${p.use}"]`).checked = true;
        document.getElementById('pDate').value = p.date;
        document.getElementById('pMemo').value = p.memo;

        if(p.eval.includes('유')) {
            document.querySelector('input[name="pEval"][value="유"]').checked = true;
            toggleAttachBtn(true);
            // 기존 파일명이 있으면 표시
            let match = p.eval.match(/\((.*?)\)/);
            if(match) { tempFileName = match[1]; document.getElementById('fileNameDisplay').innerText = tempFileName; }
        } else {
            document.querySelector('input[name="pEval"][value="무(평가요망)"]').checked = true;
            toggleAttachBtn(false);
        }

        // 버튼 UI 변경 및 화면 상단으로 이동
        document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> 수정 내역 저장';
        document.getElementById('saveBtn').classList.replace('btn-primary', 'btn-warning');
        document.getElementById('cancelBtn').style.display = 'inline-flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('partnerForm').reset();
        document.getElementById('pDate').value = new Date().toISOString().substring(0, 10);
        toggleAttachBtn(false);
        
        document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 저장 (신규등록)';
        document.getElementById('saveBtn').classList.replace('btn-warning', 'btn-primary');
        document.getElementById('cancelBtn').style.display = 'none';
    }

    // ================= 3. 검색 및 리스트 렌더링 =================
    function searchPartner() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        renderPartners(keyword);
    }

    function renderPartners(filterKeyword = "") {
        const tbody = document.getElementById('partnerListBody');
        let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
        tbody.innerHTML = '';
        
        partners.forEach(p => {
            // 검색어가 있을 경우 필터링 (거래처명, 사업자번호, 대표자명 검색)
            if (filterKeyword) {
                if (!p.name.toLowerCase().includes(filterKeyword) && 
                    !p.bizNo.toLowerCase().includes(filterKeyword) && 
                    !p.ceo.toLowerCase().includes(filterKeyword)) {
                    return; // 검색 조건에 안 맞으면 건너뜀
                }
            }

            const tr = document.createElement('tr');
            let evalColor = p.eval.includes('무') ? 'red' : 'blue';
            let teamName = p.code.split(' ')[0]; // 경영관리팀 (1) -> 경영관리팀
            
            tr.innerHTML = `
                <td>${p.type.split(' ')[0]}</td>
                <td><strong>${p.name}</strong></td>
                <td>${p.bizNo}</td>
                <td>${p.ceo}</td>
                <td>${p.category}</td>
                <td>${teamName}</td>
                <td>${p.phone}</td>
                <td style="color:${evalColor}; font-weight:bold;">${p.eval.split(' ')[0]}</td>
                <td>${p.use}</td>
                <td style="text-align: center; white-space: nowrap;">
                    <button onclick="editPartner(${p.id})" style="color:var(--accent); background:none; border:none; cursor:pointer; margin-right:8px; font-size:14px;" title="정보 수정"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deletePartner(${p.id})" style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:14px;" title="삭제"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deletePartner(id) {
        if(!confirm("해당 협력업체를 대장에서 완전히 삭제하시겠습니까? (이 작업은 복구할 수 없습니다.)")) return;
        let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
        partners = partners.filter(p => p.id !== id);
        localStorage.setItem('scdrs_partners', JSON.stringify(partners));
        if (typeof dbSave === 'function') dbSave('scdrs_partners', partners);   // 클라우드 동시 저장
        
        // 만약 삭제하려는 항목이 현재 수정 중인 항목이라면 수정 모드도 해제
        if(editingId === id) cancelEdit();
        
        renderPartners(document.getElementById('searchInput').value.toLowerCase().trim());
    }

    // ================= 엑셀 다운로드 =================
    function exportExcel() {
        let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
        if(partners.length === 0) { alert("다운로드할 데이터가 없습니다."); return; }
        
        const exportData = partners.map(p => ({
            "등록유형": p.type, "담당부서(코드)": p.code, "거래처명": p.name, "사업자등록번호": p.bizNo,
            "대표자명": p.ceo, "거래처담당자": p.contactName, "당사담당자": p.manager, "전화번호": p.phone,
            "휴대폰": p.mobile, "이메일": p.email, "주소": p.address, "업태": p.bizType, "종목": p.bizItem,
            "거래은행": p.bank, "계좌번호": p.account, "구분": p.category, "사용여부": p.use, "등록일": p.date,
            "평가여부": p.eval, "메모": p.memo
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "협력업체목록");
        
        let today = new Date().toISOString().substring(0, 10).replace(/-/g, '');
        XLSX.writeFile(workbook, `협력업체관리대장_${today}.xlsx`);
    }

    // ================= 엑셀 업로드 =================
    function importExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);
                
                let partners = JSON.parse(localStorage.getItem('scdrs_partners')) || [];
                let importCount = 0;

                rows.forEach(row => {
                    let compName = row["거래처명"] || row["상호명"] || row["Name"];
                    if(compName) {
                        partners.push({
                            id: Date.now() + Math.random(),
                            type: row["등록유형"] || "사업자등록번호 거래처",
                            code: row["담당부서(코드)"] || "경영관리팀 (1)",
                            name: compName,
                            bizNo: row["사업자등록번호"] || "",
                            ceo: row["대표자명"] || "",
                            contactName: row["거래처담당자"] || "",
                            manager: row["당사담당자"] || "",
                            phone: row["전화번호"] || "",
                            mobile: row["휴대폰"] || "",
                            email: row["이메일"] || "",
                            address: row["주소"] || "",
                            bizType: row["업태"] || "",
                            bizItem: row["종목"] || "",
                            bank: row["거래은행"] || "",
                            account: row["계좌번호"] || "",
                            category: row["구분"] || "기타",
                            use: row["사용여부"] || "사용",
                            date: row["등록일"] || new Date().toISOString().substring(0, 10),
                            eval: row["평가여부"] || "무(평가요망)",
                            memo: row["메모"] || ""
                        });
                        importCount++;
                    }
                });

                localStorage.setItem('scdrs_partners', JSON.stringify(partners));
        if (typeof dbSave === 'function') dbSave('scdrs_partners', partners);   // 클라우드 동시 저장
                showMsg(`${importCount}개의 협력업체 데이터가 업로드되었습니다.`);
                renderPartners();
            } catch(err) {
                alert("엑셀 파일 파싱 중 오류가 발생했습니다. 헤더 형식을 확인해주세요.");
            }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    // 초기 실행
    renderPartners();
    /* 클라우드에 저장된 협력업체 목록을 불러와 화면 갱신 */
    if (typeof dbLoad === 'function') {
        dbLoad('scdrs_partners', null).then(function (cloud) {
            if (Array.isArray(cloud)) {
                try { localStorage.setItem('scdrs_partners', JSON.stringify(cloud)); } catch (e) {}
                renderPartners();
            }
        });
    }
</script>
</body>
