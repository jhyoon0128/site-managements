<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공정별 위험성평가 시스템</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="risk-manifest.json">
<link rel="icon" href="risk-favicon.png">
<link rel="apple-touch-icon" href="risk-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="위험성평가">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="xlsx.mini.min.js"></script>
<style>
:root{
  --amber:#fbbf24; --amber-d:#f59e0b; --amber-l:#fef3c7;
  --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569;
  --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0;
  --s100:#f1f5f9; --s50:#f8fafc;
  --red:#dc2626; --red-d:#b91c1c; --red-l:#fef2f2; --red-b:#fecaca;
  --orange:#ea580c; --orange-l:#fff7ed;
  --yellow:#ca8a04; --yellow-l:#fefce8;
  --green:#10b981; --green-l:#ecfdf5;
  --blue:#3b82f6; --blue-l:#eff6ff;
  --purple:#7c3aed; --purple-l:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Noto Sans KR","맑은 고딕","Malgun Gothic",-apple-system,sans-serif;
  background:var(--s900); color:var(--s900);
  -webkit-text-size-adjust:100%;
}
#app{max-width:680px;margin:0 auto;min-height:100vh;background:var(--s50);
  box-shadow:0 0 40px rgba(0,0,0,.4);padding-bottom:90px;position:relative;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;
  border:1px solid var(--s200);border-radius:9px;padding:9px 11px;outline:none;background:#fff;}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
textarea{resize:none;line-height:1.5;}
.muted{color:var(--s500);}

/* 헤더 */
.hdr{background:linear-gradient(135deg,#1e293b,#0f172a 60%,#000);
  color:#fff;padding:28px 20px 22px;position:relative;overflow:hidden;}
.hdr::before{content:"";position:absolute;inset:0;opacity:.08;
  background:repeating-linear-gradient(45deg,#dc2626 0 10px,transparent 10px 20px);}
.hdr-row{display:flex;align-items:center;justify-content:space-between;position:relative;}
.hdr-logo{display:flex;align-items:center;gap:10px;}
.hdr-badge{width:44px;height:44px;background:var(--amber);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:24px;}
.hdr-eyebrow{font-size:11px;font-weight:800;color:var(--amber);letter-spacing:2px;}
.hdr-title{font-size:18px;font-weight:800;}
.hdr-sub{font-size:12px;color:var(--s400);margin-top:8px;position:relative;}
.icon-btn{color:var(--s400);padding:6px;border-radius:8px;font-size:20px;}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px;
  margin-top:-16px;position:relative;z-index:2;}
.stat{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:11px 12px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);}
.stat-l{font-size:11px;font-weight:600;color:var(--s500);}
.stat-l.red{color:var(--red);}
.stat-v{font-size:22px;font-weight:800;margin-top:3px;}
.stat-v.red{color:var(--red);}
.stat-v small{font-size:12px;font-weight:400;color:var(--s400);margin-left:3px;}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;border-radius:12px;padding:13px;transition:.12s;width:100%;font-size:15px;}
.btn-amber{background:var(--amber);color:var(--s900);box-shadow:0 4px 14px rgba(251,191,36,.35);}
.btn-amber:active{background:var(--amber-d);}
.btn-dark{background:var(--s900);color:#fff;}
.btn-grey{background:var(--s100);color:var(--s700);}
.btn-lg{font-size:17px;padding:15px;}
.btn-dashed{background:#fff;border:2px dashed var(--s300);color:var(--s600);}

.pad{padding:20px;}
.sec-title{font-size:13px;font-weight:800;color:var(--s700);letter-spacing:1px;}
.card{background:#fff;border:1px solid var(--s200);border-radius:12px;}
.field{background:#fff;border:1px solid var(--s200);border-radius:12px;padding:14px;}
.field-lbl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
  color:var(--s700);margin-bottom:8px;}
.field-lbl .ic{color:var(--amber-d);font-size:15px;}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;}
.note-amber{background:var(--amber-l);border:1px solid #fde68a;color:#92400e;}
.note-blue{background:var(--blue-l);border:1px solid #bfdbfe;color:#1e40af;}
.note-green{background:var(--green-l);border:1px solid #a7f3d0;color:#065f46;}
.note-red{background:var(--red-l);border:1px solid var(--red-b);color:#991b1b;}

/* 평가 이력 카드 */
.hist{display:block;width:100%;background:#fff;border:1px solid var(--s200);
  border-radius:12px;padding:14px;text-align:left;}
.hist-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.hist-site{font-weight:800;font-size:15px;}
.hist-proc{font-size:12px;color:var(--amber-d);font-weight:700;margin-top:2px;}
.hist-meta{font-size:12px;color:var(--s500);margin-top:3px;}
.hist-bar{margin-top:10px;display:flex;align-items:center;gap:8px;}
.bar{flex:1;height:6px;background:var(--s100);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--amber);}
.risk-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;
  border-radius:5px;margin-right:4px;}
.risk-high{background:#fee2e2;color:#b91c1c;}
.risk-mid{background:#fef3c7;color:#92400e;}
.risk-low{background:#d1fae5;color:#047857;}

.empty{background:#fff;border:2px dashed var(--s200);border-radius:12px;
  padding:34px 20px;text-align:center;color:var(--s500);}
.empty .big{font-size:38px;}

/* 진행 상단바 */
.topbar{background:var(--s900);color:#fff;position:sticky;top:0;z-index:30;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
.topbar-title{font-size:14px;font-weight:800;}
.progress{height:4px;background:var(--s700);}
.progress-fill{height:100%;background:var(--amber);transition:.2s;}

/* 공사 선택 카드 */
.proc-card{background:#fff;border:2px solid var(--s200);border-radius:12px;
  padding:14px;text-align:left;width:100%;transition:.12s;}
.proc-card.sel{border-color:var(--amber);background:var(--amber-l);}
.proc-card .pn{font-weight:800;font-size:15px;}
.proc-card .pm{font-size:11px;color:var(--s500);margin-top:4px;}

/* 단위작업 카드 */
.unit-card{background:#fff;border:1px solid var(--s200);border-radius:12px;overflow:hidden;}
.unit-head{display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;width:100%;background:#fff;cursor:pointer;}
.unit-name{font-weight:800;font-size:14px;text-align:left;flex:1;}
.unit-stat{font-size:11px;color:var(--s500);margin-top:2px;text-align:left;}
.chev{color:var(--s400);font-size:18px;transition:.2s;}
.chev.open{transform:rotate(90deg);}

/* 위험요인 평가 항목 */
.haz{padding:12px;border-top:1px solid var(--s100);}
.haz-cat{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:4px;background:var(--s100);color:var(--s700);margin-bottom:5px;}
.haz-risk{font-size:14px;color:var(--s900);font-weight:600;line-height:1.4;margin-bottom:10px;}
.haz-eval{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.eval-block{background:var(--s50);border-radius:8px;padding:8px;}
.eval-lbl{font-size:11px;font-weight:700;color:var(--s600);margin-bottom:5px;}
.eval-btns{display:flex;gap:4px;}
.eval-btn{flex:1;padding:6px 4px;border-radius:6px;font-size:12px;font-weight:800;
  border:2px solid var(--s200);background:#fff;color:var(--s500);}
.eval-btn.on{border-color:transparent;color:#fff;}
.eval-btn.on.h{background:var(--red);}
.eval-btn.on.m{background:var(--amber);color:var(--s900);}
.eval-btn.on.l{background:var(--green);}

.risk-result{background:var(--s900);color:#fff;border-radius:8px;padding:10px;
  text-align:center;margin-bottom:10px;}
.risk-result .lbl{font-size:11px;color:var(--s400);font-weight:600;}
.risk-result .val{font-size:18px;font-weight:800;margin-top:3px;}
.risk-result.h{background:var(--red);} 
.risk-result.m{background:var(--amber);color:var(--s900);}
.risk-result.m .lbl{color:#92400e;}
.risk-result.l{background:var(--green);}

.measure-box{background:#fff;border:1px solid var(--s200);border-radius:8px;padding:10px;margin-top:6px;}
.measure-lbl{font-size:11px;font-weight:700;color:var(--s600);margin-bottom:6px;
  display:flex;align-items:center;gap:5px;}
.ctrl-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.ctrl-btn{padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700;
  border:1.5px solid var(--s200);background:#fff;color:var(--s600);}
.ctrl-btn.on-1{background:var(--red);color:#fff;border-color:transparent;}
.ctrl-btn.on-2{background:var(--orange);color:#fff;border-color:transparent;}
.ctrl-btn.on-3{background:var(--yellow);color:#fff;border-color:transparent;}
.ctrl-btn.on-4{background:var(--blue);color:#fff;border-color:transparent;}
.ctrl-btn.on-5{background:var(--green);color:#fff;border-color:transparent;}

.haz-dates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;}
.haz-dates .lbl{font-size:10px;color:var(--s500);font-weight:600;}
.haz-dates input{font-size:13px;padding:6px 8px;}

.haz-del{position:absolute;top:8px;right:8px;color:var(--red);font-size:14px;
  padding:4px 8px;background:rgba(255,255,255,.8);border-radius:5px;}
.haz-wrap{position:relative;}

/* 요약 */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sum-box{border-radius:10px;padding:12px;text-align:center;}
.sum-box .v{font-size:24px;font-weight:800;}
.sum-box .l{font-size:11px;font-weight:600;margin-top:1px;}
.sum-h{background:var(--red-l);} .sum-h .v,.sum-h .l{color:var(--red-d);}
.sum-m{background:var(--amber-l);} .sum-m .v,.sum-m .l{color:#92400e;}
.sum-l{background:var(--green-l);} .sum-l .v,.sum-l .l{color:#047857;}

/* 결재/서명 */
.appr{border:1px solid var(--s200);border-radius:10px;padding:12px;}
.appr-lbl{font-size:11px;font-weight:800;color:var(--s600);margin-bottom:7px;}
.appr-role{display:inline-block;font-size:10px;background:var(--s100);color:var(--s700);
  padding:2px 7px;border-radius:4px;margin-left:5px;font-weight:600;}
.sigwrap{position:relative;background:#fff;border:2px dashed var(--s300);
  border-radius:9px;overflow:hidden;}
.sigwrap canvas{display:block;width:100%;height:100px;touch-action:none;}
.sig-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--s300);font-size:13px;pointer-events:none;}
.sig-clear{margin-top:4px;font-size:11px;color:var(--s500);text-decoration:underline;}

.appr-view{border:1px solid var(--s200);border-radius:9px;padding:9px;}
.appr-view .nm{font-size:14px;font-weight:700;margin:3px 0;}
.appr-view img{height:40px;object-fit:contain;}
.appr-view .no-sig{height:40px;display:flex;align-items:center;color:var(--s300);font-size:11px;}

/* 하단 고정 */
.bottombar{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;
  background:#fff;border-top:1px solid var(--s200);padding:11px 14px;
  display:flex;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.07);z-index:40;}

.codeblock{background:var(--s900);color:#e2e8f0;padding:14px;border-radius:11px;
  font-size:11px;white-space:pre-wrap;overflow-x:auto;line-height:1.5;}

.flex{display:flex;} .between{justify-content:space-between;}
.aic{align-items:center;} .gap8{gap:8px;}
.mt8{margin-top:8px;}.mt10{margin-top:10px;}.col{display:flex;flex-direction:column;}
.spinner{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--s900);color:var(--amber);font-size:16px;}

/* 설치 배너 */
.install{margin:14px 20px 0;background:#fff;border:1px solid var(--s200);
  border-radius:12px;padding:13px;display:flex;align-items:center;gap:11px;}
.install .txt{flex:1;font-size:12px;color:var(--s600);line-height:1.5;}
.install button{background:var(--s900);color:#fff;font-weight:700;font-size:12px;
  padding:9px 13px;border-radius:9px;white-space:nowrap;}

@media print{
  body{background:#fff;}
  #app{box-shadow:none;max-width:none;padding-bottom:0;}
  .topbar,.bottombar,.install,.hdr .icon-btn{display:none!important;}
  .card,.unit-card,.field{break-inside:avoid;}
}
</style>
</head>

function loadCompanies(){
  try{ var r = localStorage.getItem(COMPANIES_KEY); return r ? JSON.parse(r) : []; }
  catch(e){ return []; }
}
function saveCompaniesArr(arr){
  try{ localStorage.setItem(COMPANIES_KEY, JSON.stringify(arr)); if (typeof dbSave==='function') dbSave(COMPANIES_KEY, arr); return true; }
  catch(e){ return false; }
}
function newCompany(name, typeKey){
  return {
    id: "c_" + Date.now() + Math.random().toString(36).slice(2,6),
    name: name,
    type: typeKey || "sub",
    note: "",
    createdAt: new Date().toISOString()
  };
}
function getCompany(id){
  var arr = state.companies || loadCompanies();
  return arr.filter(function(c){return c.id===id;})[0] || null;
}
function getCompanyTypeInfo(typeKey){
  return COMPANY_TYPES.filter(function(t){return t.key===typeKey;})[0] || COMPANY_TYPES[2];
}

// 위험요인 텍스트와 카테고리로 산안법령 조문·근거 자동 추론
function inferLaw(category, riskText){
  var text = (riskText || "");
  // 키워드 우선 매칭
  for(var i = 0; i < LAW_MAP.byKeyword.length; i++){
    var rule = LAW_MAP.byKeyword[i];
    for(var j = 0; j < rule.kw.length; j++){
      if(text.indexOf(rule.kw[j]) >= 0){
        return { art: rule.art, basis: rule.basis };
      }
    }
  }
  // 카테고리 fallback
  var cat = (category || "").trim();
  if(LAW_MAP.byCategory[cat]){
    return LAW_MAP.byCategory[cat];
  }
  return { art: "", basis: "" };
}

var CTRLS = [
  { id:1, name:"제거", desc:"위험요인 자체 제거" },
  { id:2, name:"대체", desc:"덜 위험한 것으로 대체" },
  { id:3, name:"공학적", desc:"방호장치·차단·격리" },

/* 위험성 매트릭스: [가능성][중대성] = 결과 (0:하, 1:중, 2:상) */
var RISK_MATRIX = [
  [0, 0, 1],  // 가능성 하
  [0, 1, 2],  // 가능성 중
  [1, 2, 2]   // 가능성 상
];
function calcRisk(prob, sev){
  if(prob==null || sev==null) return null;
  var p = LEVELS.indexOf(prob), s = LEVELS.indexOf(sev);
  if(p<0 || s<0) return null;
  return LEVELS[RISK_MATRIX[p][s]];
}

/* 공사 선택 시 단위작업 초기화 */
function initUnitsFromProcess(assess, procIdx){
  var p = PROCESSES[procIdx];
  if(!p) return;
  assess.processIdx = procIdx;
  assess.units = p.u.map(function(u, ui){
    return {
      id: "u_"+ui,
      name: u.n,
      hazards: u.h.map(function(h, hi){
        return {
          id: "h_"+ui+"_"+hi,
          category: h.c,
          risk: h.r,
          probability: null,
          severity: null,
          measure: h.m,  // 기본 감소대책
          controlType: null,
          improveStart: "",
          improveEnd: "",
          owner: "",
          afterRisk: null,   // 개선 후 위험성
          lawNumber: inferLaw(h.c, h.r).art,     // 조문번호 (자동 추론)
          lawBasis: inferLaw(h.c, h.r).basis     // 관련근거 (자동 추론)
        };
      })
    };
  });
}

function getProcessName(a){
  if(a.customProcess) return a.customProcess;
  if(a.processIdx!=null && PROCESSES[a.processIdx]) return PROCESSES[a.processIdx].n;
  return "(미선택)";
}

function countRisk(assess){
  var s = {h:0, m:0, l:0, none:0};
  (assess.units||[]).forEach(function(u){
    u.hazards.forEach(function(h){
      var r = calcRisk(h.probability, h.severity);
      if(r==="상") s.h++;
      else if(r==="중") s.m++;
      else if(r==="하") s.l++;
      else s.none++;
    });
  });
  return s;
}

function exportText(a){
  var t="[공정별 위험성평가서]\n"+Array(40).join("=")+"\n\n";
  if(a.companyName) t+="■ 업체명: "+a.companyName+"\n";
  t+="■ 현장명: "+a.siteName+"\n";
  t+="■ 공사: "+getProcessName(a)+"\n";
  t+="■ 평가일: "+a.date+"\n";
  t+="■ 평가기간: "+a.workPeriod+"\n";
  t+="■ 평가자: "+a.assessor+"\n";
  t+="■ 협력사: "+a.partner+"\n\n";
  var s = countRisk(a);
  t+="[위험성 평가 결과]\n  상 "+s.h+" / 중 "+s.m+" / 하 "+s.l+" (미평가 "+s.none+")\n\n";
  (a.units||[]).forEach(function(u, ui){
    t+="["+(ui+1)+". "+u.name+"]\n";
    u.hazards.forEach(function(h, hi){
      var r = calcRisk(h.probability, h.severity);
      t+="  "+(hi+1)+". ["+h.category+"] "+h.risk+"\n";
      t+="     가능성:"+(h.probability||"-")+" / 중대성:"+(h.severity||"-")+" / 위험성:"+(r||"-")+"\n";
      if(h.measure) t+="     감소대책: "+h.measure+"\n";
      if(h.controlType){
        var c = CTRLS.filter(function(x){return x.id===h.controlType;})[0];
        if(c) t+="     조치단계: "+c.id+"."+c.name+"\n";
      }
      if(h.improveStart||h.improveEnd) t+="     개선기간: "+h.improveStart+" ~ "+h.improveEnd+"\n";
      if(h.owner) t+="     담당자: "+h.owner+"\n";
    });
    t+="\n";
  });
  if(a.comment) t+="[종합의견]\n"+a.comment+"\n\n";
  t+="[결재]\n";
  APPROVALS.forEach(function(r){
    var x=a.approvals&&a.approvals[r.key];
    t+="  "+r.label+"("+r.role+"): "+((x&&x.name)||"-")+((x&&x.signature)?" (서명)":"")+"\n";
  });
  t+="\n"+Array(40).join("=")+"\n";
  t+="※ 산업안전보건법 제36조(위험성평가)·중대재해처벌법 시행령 제4조 제3호\n";
  t+="작성: "+new Date(a.createdAt).toLocaleString("ko-KR")+"\n";
  return t;
}

/* ===== 서명 패드 ===== */
function initSignaturePads(){
  app.querySelectorAll("canvas[data-sig]").forEach(function(canvas){
    var key = canvas.getAttribute("data-sig");
    var ratio = window.devicePixelRatio||1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width*ratio;
    canvas.height = rect.height*ratio;
    var ctx = canvas.getContext && canvas.getContext("2d");
    if(!ctx) return;
    ctx.scale(ratio,ratio);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1e293b";
    var existing = state.draft.approvals[key].signature;
    if(existing){
      var im = new Image();
      im.onload = function(){ ctx.drawImage(im,0,0,rect.width,rect.height); };
      im.src = existing;
    }
    var drawing=false, last={x:0,y:0};
    function pos(e){
      var r = canvas.getBoundingClientRect();
      var t = e.touches && e.touches[0];
      return {x:(t?t.clientX:e.clientX)-r.left, y:(t?t.clientY:e.clientY)-r.top};
    }
    function start(e){ e.preventDefault(); drawing=true; last=pos(e);
      var ph=canvas.parentNode.querySelector(".sig-ph"); if(ph) ph.style.display="none"; }
    function move(e){
      if(!drawing) return; e.preventDefault();
      var p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p;
    }
    function end(){
      if(!drawing) return; drawing=false;
      state.draft.approvals[key].signature = canvas.toDataURL("image/png");
    }
    canvas.addEventListener("mousedown",start);
    canvas.addEventListener("mousemove",move);
    canvas.addEventListener("mouseup",end);
    canvas.addEventListener("mouseleave",end);
    canvas.addEventListener("touchstart",start,{passive:false});
    canvas.addEventListener("touchmove",move,{passive:false});
    canvas.addEventListener("touchend",end);
  });
}

function render(opts){
  opts = opts || {};
  var savedScroll = window.scrollY || window.pageYOffset || 0;
  if(state.view==="home") renderHome();
  else if(state.view==="new") renderNew();
  else if(state.view==="detail") renderDetail();
  else if(state.view==="settings") renderSettings();
  // 스크롤 위치 보존: opts.keepScroll=true이거나 평가 중 위험요인 클릭 시 이전 스크롤 위치 복원
  if(opts.keepScroll){
    requestAnimationFrame(function(){
      window.scrollTo(0, savedScroll);
      // 특정 항목으로 스크롤하라는 요청이 있으면 처리
      if(opts.focusHazId){
        var el = document.getElementById("haz-" + opts.focusHazId);
        if(el){
          var rect = el.getBoundingClientRect();
          // 화면 밖에 있을 때만 스크롤
          if(rect.top < 0 || rect.bottom > window.innerHeight){
            el.scrollIntoView({ behavior: "auto", block: "center" });
          }
        }
      }
    });
  } else {
    window.scrollTo(0, 0);

    allList;
  var today = todayStr();
  var todayN = list.filter(function(x){return x.date===today;}).length;
  var totalH = list.reduce(function(n,x){return n + countRisk(x).h;}, 0);

  var inst = "";
  if(deferredPrompt){
    inst = '<div class="install"><div style="font-size:24px">📲</div>'+
      '<div class="txt"><b>홈 화면에 앱으로 설치</b><br>오프라인에서도 빠르게 실행됩니다.</div>'+

      '<div style="margin-top:8px;font-size:14px">아직 평가 기록이 없습니다</div>'+
      '<div style="font-size:12px;color:var(--s400);margin-top:3px">위 버튼을 눌러 첫 평가를 시작하세요</div></div>';

    histHtml = '<div class="col gap8">'+list.map(function(a){
      var s = countRisk(a);
      var total = s.h+s.m+s.l+s.none;
      var done = s.h+s.m+s.l;
      var pct = total>0 ? Math.round(done/total*100) : 0;
      var signed = APPROVALS.filter(function(r){
        return a.approvals && a.approvals[r.key] && a.approvals[r.key].signature;
      }).length;

      var companyBadge = "";

        companyBadge = '<span style="display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:#fff;color:'+ti.color+';border:1px solid '+ti.color+';margin-right:5px">['+ti.label+'] '+esc(company.name)+'</span>';
      } else if(a.companyName){
        companyBadge = '<span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--s100);color:var(--s600);margin-right:5px">'+esc(a.companyName)+'</span>';
      }
      return '<button class="hist" data-act="detail" data-id="'+esc(a.id)+'">'+
        '<div class="hist-top"><div style="flex:1;min-width:0">'+
          '<div style="margin-bottom:4px">'+typeBadge+companyBadge+'</div>'+
          '<div class="hist-site">'+esc(a.siteName||"(현장명 미입력)")+'</div>'+
          '<div class="hist-proc">📋 '+esc(getProcessName(a))+'</div>'+
          '<div class="hist-meta">'+esc(a.date)+' · '+esc(a.assessor||"미기재")+'</div>'+
        '</div></div>'+
        '<div class="hist-bar">'+
          '<span class="risk-tag risk-high">상 '+s.h+'</span>'+
          '<span class="risk-tag risk-mid">중 '+s.m+'</span>'+
          '<span class="risk-tag risk-low">하 '+s.l+'</span>'+
          '<div class="bar" style="flex:1"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
          '<span style="font-size:11px;color:var(--s500);font-weight:600">'+pct+'%</span>'+

      '</button>';
    }).join("")+'</div>';

  // 회사 필터 칩
  var companies = state.companies || [];
  var filterHtml = "";
  if(companies.length > 0){
    var allActive = !state.filterCompanyId ? " sel" : "";
    filterHtml = '<div style="padding:0 20px;margin-top:14px"><div style="font-size:10px;font-weight:700;color:var(--s500);margin-bottom:6px;letter-spacing:1px">🏢 회사 필터</div>'+

        }).join("")+

  app.innerHTML =
    '<div class="hdr"><div class="hdr-row"><div class="hdr-logo">'+
      '<div class="hdr-badge">⚠️</div><div>'+
        '<div class="hdr-eyebrow">RISK ASSESSMENT</div>'+
        '<div class="hdr-title">공정별 위험성평가</div>'+
      '</div></div>'+
      '<button class="icon-btn" data-act="settings" style="color:#fff">⚙</button>'+
    '</div><div class="hdr-sub">3단계 판단법 · KRAS 기반 · 5인 결재 (산안법 제36조)</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="stat-l">오늘 평가</div><div class="stat-v">'+todayN+'<small>건</small></div></div>'+
      '<div class="stat"><div class="stat-l">누적 평가</div><div class="stat-v">'+list.length+'<small>건</small></div></div>'+
      '<div class="stat"><div class="stat-l red">고위험 누적</div><div class="stat-v red">'+totalH+'<small>건</small></div></div>'+
    '</div>'+

    filterHtml+
    '<div class="pad" style="padding-bottom:0"><button class="btn btn-amber btn-lg" data-act="new">＋ 새 위험성평가 시작</button></div>'+

      '<span style="font-size:11px;color:var(--s400)">'+list.length+'건</span></div>'+
      histHtml+
    '</div>';

  bindCommon();
}

/* ===== 새 평가 ===== */
function renderNew(){
  var d = state.draft;
  var bodyHtml;
  if(state.step===0) bodyHtml = stepType(d);
  else if(state.step===1) bodyHtml = stepBasic(d);
  else if(state.step===2) bodyHtml = stepProcess(d);
  else if(state.step===3) bodyHtml = stepAssess(d);
  else bodyHtml = stepApprove(d);

  var navHtml = '<div class="bottombar">';
  if(state.step>0) navHtml += '<button class="btn btn-grey" data-act="prevstep">‹ 이전</button>';
  if(state.step<STEPS.length-1) navHtml += '<button class="btn btn-dark" data-act="nextstep">다음 ›</button>';
  else navHtml += '<button class="btn btn-amber" data-act="submit">💾 평가 완료 저장</button>';
  navHtml += '</div>';

  app.innerHTML =
    '<div class="topbar"><div class="topbar-row">'+
      '<button class="icon-btn" data-act="home" style="color:#fff">‹</button>'+
      '<div class="topbar-title">'+STEPS[state.step]+' ('+(state.step+1)+'/'+STEPS.length+')</div>'+
      '<div style="width:28px"></div></div>'+
      '<div class="progress"><div class="progress-fill" style="width:'+((state.step+1)/STEPS.length*100)+'%"></div></div>'+
    '</div>'+
    '<div class="pad col gap10" style="padding-bottom:30px">'+bodyHtml+'</div>'+
    navHtml;

  bindCommon();
  bindNew();
  if(state.step===4) initSignaturePads();
}

    '<b>📚 법령 참조</b> · 최신 산안법령은 국가법령정보센터에서 확인하세요<br>'+
    '<a href="https://www.law.go.kr/LSW/lsLawLinkInfo.do?lsJoLnkSeq=900386193" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline">산업안전보건법 제36조(위험성평가의 실시)</a><br>'+
    '<a href="https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000251014" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline">사업장 위험성평가에 관한 지침 (고시 제2024-76호)</a><br>'+
    '<a href="https://kras.kosha.or.kr/kras24/" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline">KRAS 위험성평가 시스템 (한국산업안전보건공단)</a>'+
  '</div>';

function stepProcess(d){
  var html = '<div class="note note-blue">평가할 <b>공사(작업공정)</b>를 선택하세요. 선택 후 다음 단계에서 단위작업·위험요인 추가·삭제·수정이 가능합니다. (KRAS 표준 양식 기준)</div>';
  html += '<div class="col gap8">';
  PROCESSES.forEach(function(p, i){
    var nUnits = p.u.length;
    var nHaz = p.u.reduce(function(n,u){return n+u.h.length;}, 0);
    var sel = (d.processIdx===i);
    html += '<button class="proc-card'+(sel?" sel":"")+'" data-act="selproc" data-idx="'+i+'">'+
      '<div class="pn">'+(i+1)+'. '+esc(p.n)+(sel?' ✓':'')+'</div>'+

    '<td style="border:1px solid var(--s300);padding:5px;text-align:center;background:var(--amber-l);font-weight:700">중</td>'+

  d.units.forEach(function(u, ui){
    var open = state.openUnit===u.id;
    var done = u.hazards.filter(function(h){return h.probability && h.severity;}).length;
    var totalH = u.hazards.length;
    var ngs = u.hazards.map(function(h){return calcRisk(h.probability, h.severity);});
    var hc = ngs.filter(function(r){return r==="상";}).length;
    var mc = ngs.filter(function(r){return r==="중";}).length;
    html += '<div class="unit-card">'+
      '<div class="unit-head" style="position:relative">'+
        '<div data-act="toggleunit" data-id="'+u.id+'" style="flex:1;display:flex;align-items:center;cursor:pointer">'+
          '<div style="flex:1"><div class="unit-name">'+(ui+1)+'. '+esc(u.name)+'</div>'+
          '<div class="unit-stat">완료 '+done+'/'+totalH+
          (hc>0?' · <span style="color:var(--red);font-weight:700">상 '+hc+'</span>':'')+
          (mc>0?' · <span style="color:var(--amber-d);font-weight:700">중 '+mc+'</span>':'')+
          '</div></div>'+
          '<span class="chev'+(open?" open":"")+'">›</span>'+
        '</div>'+
        '<button data-act="delunit" data-uid="'+u.id+'" style="position:absolute;top:8px;right:38px;color:var(--red);font-size:13px;padding:4px 8px;background:rgba(255,255,255,.8);border-radius:5px;border:1px solid var(--red-b)">🗑 단위작업 삭제</button>'+
      '</div>';
    if(open){
      // 단위작업명 직접 편집
      html += '<div style="padding:10px 12px;background:var(--s50);border-top:1px solid var(--s200)">'+
        '<div class="mini-lbl">단위작업명 (세부작업내용)</div>'+
        '<input data-unitname="'+u.id+'" value="'+esc(u.name)+'" placeholder="단위작업명을 입력하세요" style="font-size:14px">'+
      '</div>';
      u.hazards.forEach(function(h, hi){
        html += renderHazard(u.id, h, hi);
      });
      // 위험요인 추가 버튼
      html += '<div style="padding:10px;border-top:1px solid var(--s100)">'+
        '<button class="btn btn-dashed" data-act="addhaz" data-uid="'+u.id+'" style="font-size:12px;padding:9px">＋ 이 단위작업에 위험요인 추가</button>'+
        '</div>';
    }
    html += '</div>';
  });

  // 단위작업 추가
  html += '<button class="btn btn-dashed" data-act="addunit">＋ 단위작업 추가</button>';
  return html;
}

function renderHazard(uid_, h, hi){
  var risk = calcRisk(h.probability, h.severity);
  var riskClass = risk==="상"?"h":risk==="중"?"m":risk==="하"?"l":"";
  var probBtns = LEVELS.map(function(lv){
    var on = h.probability===lv;
    var cls = lv==="상"?"h":lv==="중"?"m":"l";
    return '<button class="eval-btn'+(on?" on "+cls:"")+'" data-act="setprob" data-uid="'+uid_+'" data-hid="'+h.id+'" data-val="'+lv+'">'+lv+'</button>';
  }).join("");
  var sevBtns = LEVELS.map(function(lv){
    var on = h.severity===lv;
    var cls = lv==="상"?"h":lv==="중"?"m":"l";
    return '<button class="eval-btn'+(on?" on "+cls:"")+'" data-act="setsev" data-uid="'+uid_+'" data-hid="'+h.id+'" data-val="'+lv+'">'+lv+'</button>';
  }).join("");

  var ctrlBtns = CTRLS.map(function(c){
    var on = h.controlType===c.id;
    return '<button class="ctrl-btn'+(on?" on-"+c.id:"")+'" data-act="setctrl" data-uid="'+uid_+'" data-hid="'+h.id+'" data-val="'+c.id+'" title="'+esc(c.desc)+'">'+c.id+'. '+c.name+'</button>';
  }).join("");

  // 카테고리 옵션 (KRAS 위험분류 6종)
  var catOpts = ["인적 요인","기계적 요인","전기적 요인","재료적 요인","작업특성 요인","작업환경 요인","물적 요인"];

  return '<div class="haz haz-wrap" id="haz-'+h.id+'">'+
    '<button class="haz-del" data-act="delhaz" data-uid="'+uid_+'" data-hid="'+h.id+'">🗑</button>'+
    // KRAS 양식: 위험분류 + 위험발생상황 (편집 가능)
    '<div style="margin-bottom:7px">'+
      '<div class="mini-lbl">유해위험요인 분류</div>'+
      '<select data-hazedit="'+uid_+'|'+h.id+'|category" style="font-size:13px;padding:5px 8px">'+
        catOpts.map(function(c){
          return '<option value="'+esc(c)+'"'+(h.category===c?' selected':'')+'>'+esc(c)+'</option>';
        }).join("")+
      '</select>'+
    '</div>'+
    '<div class="mini-lbl">위험발생 상황 및 결과 ('+(hi+1)+')</div>'+
    '<textarea rows="2" data-hazedit="'+uid_+'|'+h.id+'|risk" style="font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4">'+esc(h.risk)+'</textarea>'+
    '<div class="haz-eval">'+
      '<div class="eval-block"><div class="eval-lbl">가능성(빈도)</div><div class="eval-btns">'+probBtns+'</div></div>'+
      '<div class="eval-block"><div class="eval-lbl">중대성(강도)</div><div class="eval-btns">'+sevBtns+'</div></div>'+
    '</div>'+
    (risk?'<div class="risk-result '+riskClass+'"><div class="lbl">현재 위험성 수준</div><div class="val">'+risk+'</div></div>':
      '<div class="risk-result" style="background:var(--s200);color:var(--s500)"><div class="lbl">현재 위험성 수준</div><div class="val">미평가</div></div>')+
    // KRAS: 현재의 안전보건조치 (기존 measure 필드 활용)
    '<div class="measure-box">'+
      '<div class="measure-lbl">📝 위험성 감소대책 (제거→대체→공학적→관리적→보호구 우선순위 적용)</div>'+
      '<textarea rows="2" data-hazprop="'+h.id+'_measure" data-uid="'+uid_+'" placeholder="감소대책을 입력하세요">'+esc(h.measure||"")+'</textarea>'+
      '<div class="ctrl-row" style="margin-top:8px">'+ctrlBtns+'</div>'+
      '<div class="haz-dates">'+
        '<div><div class="lbl">개선예정일</div><input type="date" data-hazprop="'+h.id+'_improveStart" data-uid="'+uid_+'" value="'+esc(h.improveStart||"")+'"></div>'+
        '<div><div class="lbl">개선종료일</div><input type="date" data-hazprop="'+h.id+'_improveEnd" data-uid="'+uid_+'" value="'+esc(h.improveEnd||"")+'"></div>'+
        '<div><div class="lbl">담당자</div><input data-hazprop="'+h.id+'_owner" data-uid="'+uid_+'" value="'+esc(h.owner||"")+'" placeholder="성명"></div>'+
      '</div>'+
      // 개선 후 위험성 수준
      '<div style="margin-top:10px;background:var(--green-l);border:1px solid #a7f3d0;border-radius:8px;padding:10px">'+
        '<div class="eval-lbl" style="color:#047857;margin-bottom:6px">✓ 개선 후 위험성 수준 (감소대책 실행 후 예상)</div>'+
        '<div class="eval-btns">'+
          LEVELS.map(function(lv){
            var on = h.afterRisk===lv;
            var cls = lv==="상"?"h":lv==="중"?"m":"l";
            return '<button class="eval-btn'+(on?" on "+cls:"")+'" data-act="setafter" data-uid="'+uid_+'" data-hid="'+h.id+'" data-val="'+lv+'">'+lv+'</button>';
          }).join("")+
        '</div>'+
      '</div>'+
      // 산안법령 자동 표시 (편집 가능)
      '<div style="margin-top:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px">'+
        '<div class="eval-lbl" style="color:#1e40af;margin-bottom:6px">⚖ 관련 산안법령 (자동 추론 · 편집 가능)'+
          (h._lawEdited?' <span style="font-size:10px;color:var(--s500)">(사용자 편집)</span>':' <span style="font-size:10px;color:var(--s500)">(자동)</span>')+
        '</div>'+
        '<div class="haz-dates" style="grid-template-columns:1fr 1.5fr">'+
          '<div><div class="lbl">조문번호</div><input data-hazprop="'+h.id+'_lawNumber" data-uid="'+uid_+'" value="'+esc(h.lawNumber||"")+'" placeholder="예: 안전보건규칙 제42조" style="font-weight:600;color:#1e40af"></div>'+
          '<div><div class="lbl">관련근거 (법적기준)</div><input data-hazprop="'+h.id+'_lawBasis" data-uid="'+uid_+'" value="'+esc(h.lawBasis||"")+'" placeholder="조문 내용" style="color:#1e40af"></div>'+
        '</div>'+
        '<div style="margin-top:6px;font-size:10px;color:var(--s500)">※ 최신 조문 확인: <a href="https://www.law.go.kr/" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline">국가법령정보센터</a></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function stepApprove(d){
  var s = countRisk(d);
  var apprHtml = APPROVALS.map(function(role){
    var a = d.approvals[role.key] || {};
    return '<div class="appr"><div class="appr-lbl">'+role.label+'<span class="appr-role">'+role.role+'</span></div>'+
      '<input data-approval="'+role.key+'" value="'+esc(a.name||"")+'" placeholder="성명 입력" style="margin-bottom:8px">'+
      '<div class="sigwrap"><canvas data-sig="'+role.key+'"></canvas>'+
        (a.signature?"":'<div class="sig-ph">여기에 손가락으로 서명</div>')+
      '</div>'+
      '<button class="sig-clear" data-act="clearsig" data-key="'+role.key+'">서명 지우기</button>'+
    '</div>';
  }).join("");

  return ''+
  '<div class="note note-green">평가 결과를 확인하고, 종합의견 작성 후 5인 결재란에 서명 받아 저장합니다.</div>'+
  '<div class="card pad" style="padding:14px"><div class="sec-title" style="margin-bottom:11px">위험성 평가 결과</div>'+
    '<div class="sum3">'+
      '<div class="sum-box sum-h"><div class="v">'+s.h+'</div><div class="l">상 (높음)</div></div>'+
      '<div class="sum-box sum-m"><div class="v">'+s.m+'</div><div class="l">중 (보통)</div></div>'+
      '<div class="sum-box sum-l"><div class="v">'+s.l+'</div><div class="l">하 (낮음)</div></div>'+
    '</div>'+
    (s.none>0?'<div style="font-size:12px;color:var(--s500);text-align:center;margin-top:8px">미평가: '+s.none+'건</div>':'')+
  '</div>'+
  '<div class="field"><div class="field-lbl"><span class="ic">✏️</span>종합의견</div>'+
    '<textarea rows="4" data-field="comment" placeholder="평가 결과 종합 / 후속 조치 계획 / 차기 평가 시 점검사항 등">'+esc(d.comment||"")+'</textarea></div>'+
  '<div class="card pad" style="padding:14px"><div class="field-lbl"><span class="ic">✍️</span>결재 (5인)</div>'+
    '<div class="col gap10" style="margin-top:4px">'+apprHtml+'</div></div>'+
  '<div class="note note-amber">저장 후에는 수정할 수 없습니다. 결재가 늦어지면 우선 작성자만 서명하고 저장한 뒤 추후 <b>공유하기</b>로 보고할 수 있습니다.</div>';
}

/* ===== 상세 ===== */
function renderDetail(){
  var a = state.assessments.filter(function(x){return x.id===state.selectedId;})[0];
  if(!a){ state.view="home"; render(); return; }
  var s = countRisk(a);

  var unitsHtml = (a.units||[]).map(function(u, ui){
    var rows = u.hazards.map(function(h, hi){
      var r = calcRisk(h.probability, h.severity);
      var rcls = r==="상"?"risk-high":r==="중"?"risk-mid":r==="하"?"risk-low":"";
      var ctrl = h.controlType ? CTRLS.filter(function(c){return c.id===h.controlType;})[0] : null;
      return '<div style="padding:10px;border-top:1px solid var(--s100)">'+
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px">'+
          '<span class="haz-cat">'+esc(h.category)+'</span>'+
          (r?'<span class="risk-tag '+rcls+'">현재 '+r+'</span>':'')+
          (h.afterRisk?'<span class="risk-tag" style="background:var(--green-l);color:#047857">→ 개선후 '+esc(h.afterRisk)+'</span>':'')+
          (ctrl?'<span class="risk-tag" style="background:var(--blue-l);color:var(--blue)">'+ctrl.id+'.'+ctrl.name+'</span>':'')+
        '</div>'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:5px">'+(hi+1)+'. '+esc(h.risk)+'</div>'+
        '<div style="font-size:11px;color:var(--s500);margin-bottom:4px">가능성:'+(h.probability||"-")+' / 중대성:'+(h.severity||"-")+'</div>'+
        (h.measure?'<div style="font-size:12px;background:var(--s50);padding:7px;border-radius:6px;margin-top:4px">→ '+esc(h.measure)+'</div>':'')+
        ((h.improveStart||h.improveEnd||h.owner)?'<div style="font-size:11px;color:var(--s500);margin-top:4px">'+
          (h.improveStart?'예정 '+esc(h.improveStart):'')+(h.improveEnd?' ~ 종료 '+esc(h.improveEnd):'')+
          (h.owner?'　담당 '+esc(h.owner):'')+'</div>':'')+
        ((h.lawNumber||h.lawBasis)?'<div style="font-size:11px;color:#1e40af;margin-top:5px;padding:5px 7px;background:#eff6ff;border-radius:5px;border-left:2px solid var(--blue)">⚖ '+esc(h.lawNumber||"")+(h.lawBasis?' — '+esc(h.lawBasis):"")+'</div>':'')+
      '</div>';
    }).join("");
    return '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:12px 14px;background:var(--s50);font-weight:800;font-size:14px;border-bottom:1px solid var(--s200)">'+(ui+1)+'. '+esc(u.name)+' <span style="font-size:11px;font-weight:500;color:var(--s500)">('+u.hazards.length+'건)</span></div>'+
      rows+
    '</div>';
  }).join("");

  var apprHtml = '<div class="card pad" style="padding:14px"><div class="sec-title" style="margin-bottom:10px">결재 (5인)</div>'+
    '<div class="col gap8">'+APPROVALS.map(function(role){
      var x = a.approvals && a.approvals[role.key];
      return '<div class="appr-view" style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1"><div class="appr-lbl" style="margin:0">'+role.label+'<span class="appr-role">'+role.role+'</span></div>'+
        '<div class="nm">'+esc((x&&x.name)||"-")+'</div></div>'+
        ((x&&x.signature)?'<img src="'+x.signature+'" style="height:36px;width:auto">':'<div class="no-sig" style="height:36px;width:80px;border:1px dashed var(--s200);border-radius:4px;justify-content:center">미서명</div>')+
      '</div>';
    }).join("")+'</div></div>';

  app.innerHTML =
    '<div class="topbar"><div class="topbar-row">'+
      '<button class="icon-btn" data-act="home" style="color:#fff">‹</button>'+
      '<div class="topbar-title">평가 상세</div>'+
      '<button class="icon-btn" data-act="delete" data-id="'+esc(a.id)+'" style="color:#f87171">🗑</button>'+
    '</div></div>'+
    '<div class="pad col gap10 pad-bot" style="padding-bottom:100px">'+
      '<div class="card pad" style="padding:14px">'+
        (a.companyName?'<div style="font-size:11px;color:var(--s400);font-weight:600;margin-bottom:1px">'+esc(a.companyName)+'</div>':'')+
        (function(){
          var atype = ASSESS_TYPES.filter(function(t){return t.key===a.assessType;})[0];
          var badges = atype ? '<span style="display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;background:'+atype.color+';color:#fff;margin-right:5px">'+atype.name+'</span>' : '';
          // 회사 배지
          var company = a.companyId ? getCompany(a.companyId) : null;
          if(company){
            var ti = getCompanyTypeInfo(company.type);
            badges += '<span style="display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;background:#fff;color:'+ti.color+';border:1.5px solid '+ti.color+'">['+ti.label+'] '+esc(company.name)+'</span>';
          } else if(a.companyName){
            badges += '<span style="display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;background:var(--s100);color:var(--s700)">'+esc(a.companyName)+'</span>';
          }
          return badges ? '<div style="margin-bottom:8px">'+badges+'</div>' : '';
        })()+
        '<div style="font-size:18px;font-weight:800">'+esc(a.siteName)+'</div>'+
        '<div style="font-size:13px;color:var(--amber-d);font-weight:700;margin:3px 0 8px">📋 '+esc(getProcessName(a))+'</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--s600)">'+
          '<div>평가일: <b>'+esc(a.date)+'</b></div>'+
          '<div>평가자: <b>'+esc(a.assessor)+'</b></div>'+
          (a.workPeriod?'<div style="grid-column:1/-1">적용기간: '+esc(a.workPeriod)+'</div>':'')+
          (a.partner?'<div style="grid-column:1/-1">협력사: '+esc(a.partner)+'</div>':'')+
        '</div>'+
      '</div>'+
      (a.assessType==="constant" && a.dailyLog && (a.dailyLog.mainWork||a.dailyLog.tbmContent) ? 
        '<div class="card pad" style="padding:14px;border-left:4px solid var(--green)">'+
          '<div class="sec-title" style="margin-bottom:8px;color:var(--green)">📋 일일 작업/안전일보 (TBM)</div>'+
          '<div style="font-size:12px;line-height:1.7;color:var(--s700)">'+
            '<div><b>작업일자:</b> '+esc(a.dailyLog.workDate||"")+' / <b>날씨:</b> '+esc(a.dailyLog.weather||"")+'</div>'+
            (a.dailyLog.crew?'<div><b>투입 인원:</b> '+esc(a.dailyLog.crew)+'</div>':'')+
            (a.dailyLog.mainWork?'<div><b>주요 작업:</b> '+esc(a.dailyLog.mainWork)+'</div>':'')+
            (a.dailyLog.tbmContent?'<div style="margin-top:5px;padding:7px;background:var(--s50);border-radius:6px"><b>TBM 전달사항:</b><br>'+esc(a.dailyLog.tbmContent).replace(/\n/g,"<br>")+'</div>':'')+
            (a.dailyLog.specialNotes?'<div style="margin-top:5px"><b>특이사항:</b> '+esc(a.dailyLog.specialNotes)+'</div>':'')+
          '</div>'+
        '</div>' : '')+
      '<div class="sum3">'+
        '<div class="sum-box sum-h"><div class="v">'+s.h+'</div><div class="l">상</div></div>'+
        '<div class="sum-box sum-m"><div class="v">'+s.m+'</div><div class="l">중</div></div>'+
        '<div class="sum-box sum-l"><div class="v">'+s.l+'</div><div class="l">하</div></div>'+
      '</div>'+
      unitsHtml+
      (a.comment?'<div class="card pad" style="padding:14px"><div class="sec-title" style="margin-bottom:7px">종합의견</div>'+
        '<div style="font-size:13px;white-space:pre-wrap">'+esc(a.comment)+'</div></div>':'')+
      apprHtml+
      '<button class="btn btn-grey" data-act="toggletext">👁 '+(state.showFullText?"전체 텍스트 숨기기":"전체 텍스트 보기")+'</button>'+
      (state.showFullText?'<pre class="codeblock">'+esc(exportText(a))+'</pre>':'')+
    '</div>'+
    '<div class="bottombar">'+
      '<button class="btn btn-grey" data-act="excel" style="padding:11px 8px;font-size:13px">📊 엑셀</button>'+
      '<button class="btn btn-grey" data-act="print" style="padding:11px 8px;font-size:13px">🖨 인쇄</button>'+
      '<button class="btn btn-amber" data-act="share" style="padding:11px 8px;font-size:13px">📤 공유</button>'+
    '</div>';

  bindCommon();
  bindDetail(a);
}

    companyListHtml = '<div style="font-size:12px;color:var(--s500);padding:14px;text-align:center;background:var(--s50);border-radius:8px">등록된 회사가 없습니다.<br>아래에서 회사를 추가하세요.</div>';
  } else {

/* ===== 이벤트 바인딩 ===== */
function bindCommon(){
  app.querySelectorAll("[data-act]").forEach(function(el){
    var act = el.getAttribute("data-act");
    if(["setprob","setsev","setafter","setctrl","toggleunit","selproc","addhaz","delhaz","addunit",
        "prevstep","nextstep","submit","clearsig","delunit","setnewctype","addcompany","delcompany","editcompany"].indexOf(act)>=0) return;
    el.addEventListener("click", function(e){
      if(act==="home"){ state.view="home"; state.showFullText=false; render(); }
      else if(act==="settings"){ e.preventDefault(); state.view="settings"; render(); }
      else if(act==="new"){ state.draft=newAssess(state.settings); state.step=0; state.openUnit=null; state.view="new"; render(); }
      else if(act==="detail"){ state.selectedId=el.getAttribute("data-id"); state.showFullText=false; state.view="detail"; render(); }
      else if(act==="install"){ doInstall(); }
      else if(act==="filterc"){ state.filterCompanyId = el.getAttribute("data-id") || ""; render(); }
    });
  });
}

function bindNew(){
  // 기본 필드
  app.querySelectorAll("[data-field]").forEach(function(el){
    el.addEventListener("input", function(){
      state.draft[el.getAttribute("data-field")] = el.value;
    });
    // select 변경 시 change 이벤트도 처리
    el.addEventListener("change", function(){
      var field = el.getAttribute("data-field");
      state.draft[field] = el.value;
      // 회사 선택 시 회사명 자동 채움
      if(field === "companyId" && el.value){
        var c = getCompany(el.value);
        if(c){
          state.draft.companyName = c.name;
          // 화면의 companyName input도 즉시 업데이트
          var nameInput = app.querySelector('[data-field="companyName"]');
          if(nameInput) nameInput.value = c.name;
        }
      }
    });
  });
  // 일일 작업/안전일보 필드
  app.querySelectorAll("[data-daily]").forEach(function(el){
    el.addEventListener("input", function(){
      var k = el.getAttribute("data-daily");
      if(!state.draft.dailyLog) state.draft.dailyLog = {};
      state.draft.dailyLog[k] = el.value;
    });
  });
  // 평가 종류 선택
  app.querySelectorAll("[data-acttype]").forEach(function(el){
    el.addEventListener("click", function(){
      state.draft.assessType = el.getAttribute("data-acttype");
      render({ keepScroll: true });
    });
  });
  // 공사 선택
  app.querySelectorAll('[data-act="selproc"]').forEach(function(el){
    el.addEventListener("click", function(){
      var idx = parseInt(el.getAttribute("data-idx"), 10);
      if(state.draft.processIdx !== idx){
        if(state.draft.processIdx!=null && state.draft.units.length>0){
          if(!confirm("공사를 변경하면 입력한 평가 데이터가 초기화됩니다. 계속하시겠습니까?")) return;
        }
        initUnitsFromProcess(state.draft, idx);
        state.draft.customProcess = "";
        state.openUnit = state.draft.units[0] ? state.draft.units[0].id : null;
      }
      render();
    });
  });
  // 단위작업 토글
  app.querySelectorAll('[data-act="toggleunit"]').forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-id");
      state.openUnit = state.openUnit===id ? null : id;
      render();
    });
  });
  // 가능성/중대성 선택 - 스크롤 보존
  app.querySelectorAll('[data-act="setprob"], [data-act="setsev"], [data-act="setafter"]').forEach(function(el){
    el.addEventListener("click", function(){
      var act = el.getAttribute("data-act");
      var uid_ = el.getAttribute("data-uid");
      var hid = el.getAttribute("data-hid");
      var val = el.getAttribute("data-val");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var h = u.hazards.filter(function(x){return x.id===hid;})[0];
      if(!h) return;
      if(act==="setprob") h.probability = h.probability===val ? null : val;
      else if(act==="setsev") h.severity = h.severity===val ? null : val;
      else if(act==="setafter") h.afterRisk = h.afterRisk===val ? null : val;
      render({ keepScroll: true, focusHazId: hid });
    });
  });
  // 위험감소조치 분류 - 스크롤 보존
  app.querySelectorAll('[data-act="setctrl"]').forEach(function(el){
    el.addEventListener("click", function(){
      var uid_ = el.getAttribute("data-uid");
      var hid = el.getAttribute("data-hid");
      var val = parseInt(el.getAttribute("data-val"), 10);
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var h = u.hazards.filter(function(x){return x.id===hid;})[0];
      if(!h) return;
      h.controlType = h.controlType===val ? null : val;
      render({ keepScroll: true, focusHazId: hid });
    });
  });
  // 위험요인 입력 필드 (재렌더 없음)
  app.querySelectorAll("[data-hazprop]").forEach(function(el){
    el.addEventListener("input", function(){
      var parts = el.getAttribute("data-hazprop").split("_");
      var hid = parts.slice(0, parts.length-1).join("_");
      var prop = parts[parts.length-1];
      var uid_ = el.getAttribute("data-uid");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var h = u.hazards.filter(function(x){return x.id===hid;})[0];
      if(!h) return;
      h[prop] = el.value;
    });
  });
  // 위험요인 추가
  app.querySelectorAll('[data-act="addhaz"]').forEach(function(el){
    el.addEventListener("click", function(){
      var uid_ = el.getAttribute("data-uid");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var category = prompt("위험요인 분류를 선택하세요:\n인적 요인 / 기계적 요인 / 전기적 요인 / 재료적 요인 / 작업특성 요인 / 작업환경 요인", "인적 요인");
      if(!category) return;
      var risk = prompt("위험요인(위해요인) 내용을 입력하세요:", "");
      if(!risk) return;
      u.hazards.push({
        id: "h_custom_"+uid(),
        category: category.trim(),
        risk: risk.trim(),
        probability: null,
        severity: null,
        measure: "",
        controlType: null,
        improveStart: "",
        improveEnd: "",
        owner: "",
        afterRisk: null,
        lawNumber: inferLaw(category.trim(), risk.trim()).art,
        lawBasis: inferLaw(category.trim(), risk.trim()).basis
      });
      render();
    });
  });
  // 위험요인 삭제
  app.querySelectorAll('[data-act="delhaz"]').forEach(function(el){
    el.addEventListener("click", function(){
      if(!confirm("이 위험요인을 삭제하시겠습니까?")) return;
      var uid_ = el.getAttribute("data-uid");
      var hid = el.getAttribute("data-hid");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      u.hazards = u.hazards.filter(function(x){return x.id!==hid;});
      render({ keepScroll: true });
    });
  });
  // 단위작업 삭제
  app.querySelectorAll('[data-act="delunit"]').forEach(function(el){
    el.addEventListener("click", function(){
      var uid_ = el.getAttribute("data-uid");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      if(!confirm('단위작업 「' + u.name + '」을(를) 위험요인 ' + u.hazards.length + '건과 함께 삭제하시겠습니까?')) return;
      state.draft.units = state.draft.units.filter(function(x){return x.id!==uid_;});
      if(state.openUnit===uid_) state.openUnit = null;
      render();
    });
  });
  // 단위작업 이름 변경
  app.querySelectorAll("[data-unitname]").forEach(function(el){
    el.addEventListener("input", function(){
      var uid_ = el.getAttribute("data-unitname");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(u) u.name = el.value;
    });
  });
  // 위험요인 텍스트·분류 직접 수정 (KRAS 형식)
  app.querySelectorAll("[data-hazedit]").forEach(function(el){
    el.addEventListener("input", function(){
      var parts = el.getAttribute("data-hazedit").split("|");
      var uid_ = parts[0], hid = parts[1], prop = parts[2];
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var h = u.hazards.filter(function(x){return x.id===hid;})[0];
      if(!h) return;
      h[prop] = el.value;
      // 위험요인 텍스트가 변경되면 산안법령 자동 재추론 (사용자가 직접 입력한 경우 보존)
      if(prop === "risk" && !h._lawEdited){
        var inferred = inferLaw(h.category, h.risk);
        h.lawNumber = inferred.art;
        h.lawBasis = inferred.basis;
      }
    });
  });
  // 산안법령 사용자 직접 편집 표시
  app.querySelectorAll("[data-hazprop$=_lawNumber], [data-hazprop$=_lawBasis]").forEach(function(el){
    el.addEventListener("input", function(){
      var parts = el.getAttribute("data-hazprop").split("_");
      var hid = parts.slice(0, parts.length-1).join("_");
      var uid_ = el.getAttribute("data-uid");
      var u = state.draft.units.filter(function(x){return x.id===uid_;})[0];
      if(!u) return;
      var h = u.hazards.filter(function(x){return x.id===hid;})[0];
      if(!h) return;
      h._lawEdited = true;  // 사용자 편집 표시
    });
  });
  // 단위작업 추가
  var addUnitBtn = app.querySelector('[data-act="addunit"]');
  if(addUnitBtn) addUnitBtn.addEventListener("click", function(){
    var name = prompt("단위작업 이름을 입력하세요:", "");
    if(!name) return;
    var newU = { id:"u_custom_"+uid(), name:name.trim(), hazards:[] };
    state.draft.units.push(newU);
    state.openUnit = newU.id;
    render();
  });
  // 결재자 이름
  app.querySelectorAll("[data-approval]").forEach(function(el){
    el.addEventListener("input", function(){
      var k = el.getAttribute("data-approval");
      state.draft.approvals[k].name = el.value;
    });
  });
  // 서명 지우기
  app.querySelectorAll('[data-act="clearsig"]').forEach(function(el){
    el.addEventListener("click", function(){
      var k = el.getAttribute("data-key");
      state.draft.approvals[k].signature = null;
      render();
    });
  });
  // 단계 이동
  var prevB = app.querySelector('[data-act="prevstep"]');
  if(prevB) prevB.addEventListener("click", function(){
    if(state.step>0){ state.step--; render(); }
  });
  var nextB = app.querySelector('[data-act="nextstep"]');
  if(nextB) nextB.addEventListener("click", function(){
    // STEPS: 0=평가종류, 1=기본정보, 2=공사선택, 3=평가, 4=결재
    if(state.step===0 && !state.draft.assessType){
      alert("평가 종류를 선택해 주세요."); return;
    }
    if(state.step===2 && state.draft.processIdx==null && !state.draft.customProcess){
      alert("공사를 선택하거나 직접 입력해 주세요."); return;
    }
    if(state.step===2 && state.draft.customProcess && state.draft.processIdx==null && state.draft.units.length===0){
      // 사용자 추가 공사의 경우 빈 단위작업 1개 자동 추가
      var newU = { id:"u_custom_"+uid(), name:"새 단위작업", hazards:[] };
      state.draft.units.push(newU);
      state.openUnit = newU.id;
    }
    if(state.step<STEPS.length-1){ state.step++; render(); }
  });
  var subB = app.querySelector('[data-act="submit"]');
  if(subB) subB.addEventListener("click", function(){
    var d = state.draft;
    d.status = "submitted";
    d.submittedAt = new Date().toISOString();
    if(saveAssess(d)){
      state.assessments = loadAssess();
      state.view = "home"; render();
    }
  });
}

function bindDetail(a){
  var ex = app.querySelector('[data-act="excel"]');
  if(ex) ex.addEventListener("click", function(){ exportExcel(a); });
  var pr = app.querySelector('[data-act="print"]');
  if(pr) pr.addEventListener("click", function(){ window.print(); });
  var sh = app.querySelector('[data-act="share"]');
  if(sh) sh.addEventListener("click", function(){
    var text = exportText(a);
    if(navigator.share){
      navigator.share({title:"위험성평가_"+a.date, text:text}).catch(function(){});
    }else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        alert("평가 내용이 클립보드에 복사되었습니다.\n카톡·메일에 붙여넣기 하세요.");
      }).catch(function(){ fallbackCopy(text); });
    }else{ fallbackCopy(text); }
  });
  var del = app.querySelector('[data-act="delete"]');
  if(del) del.addEventListener("click", function(){
    if(confirm("이 평가 기록을 삭제하시겠습니까?")){
      delAssess(a.id);
      state.assessments = loadAssess();
      state.view = "home"; render();
    }
  });
  var tt = app.querySelector('[data-act="toggletext"]');
  if(tt) tt.addEventListener("click", function(){
    state.showFullText = !state.showFullText; render();
  });
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("평가 내용이 복사되었습니다."); }
  catch(e){ alert("복사를 지원하지 않는 환경입니다."); }
  document.body.removeChild(ta);
}

/* ===== 엑셀 다운로드 (업로드 양식과 동일한 구조) ===== */
function exportExcel(a){
  if(typeof XLSX === "undefined"){
    alert("엑셀 라이브러리(xlsx.mini.min.js)가 로드되지 않았습니다.\n프로그램 파일 폴더에 xlsx.mini.min.js가 함께 있는지 확인하세요.");
    return;
  }
  var procName = getProcessName(a);
  var aoa = [];  // Array of Arrays - 시트 데이터
  var merges = [];  // 병합 셀
  // 행 1: 빈 제목 영역(병합)
  // 행 2: 제목
  aoa.push([""]);
  aoa.push(["전기공사 공정별 위험성평가(3단계 판단법)"]);
  merges.push({ s:{r:0,c:0}, e:{r:0,c:10} });
  merges.push({ s:{r:1,c:0}, e:{r:1,c:10} });
  // 행 3: 평가대상 / 평가일시 / 평가자
  var atype = ASSESS_TYPES.filter(function(t){return t.key===a.assessType;})[0];
  var typeName = atype ? atype.name : "";
  // 회사 정보
  var company = a.companyId ? getCompany(a.companyId) : null;
  var companyStr = "";
  if(company){
    var ti = getCompanyTypeInfo(company.type);
    companyStr = company.name + "[" + ti.label + "]";
  } else if(a.companyName){
    companyStr = a.companyName;
  }
  aoa.push([
    "평가대상: " + (companyStr?companyStr+" / ":"") + a.siteName + " - " + procName + (typeName?" ["+typeName+"]":""), "", "",
    "평가일시: " + a.date, "",
    "평가자: " + (a.assessor||""), "", "", "", "", ""
  ]);
  merges.push({ s:{r:2,c:0}, e:{r:2,c:2} });
  merges.push({ s:{r:2,c:3}, e:{r:2,c:4} });
  merges.push({ s:{r:2,c:5}, e:{r:2,c:10} });
  // 행 4-5: 헤더 (2단)
  aoa.push([
    "유해위험요인 파악", "", "현재의 안전보건조치", "위험성 수준판단",
    "위험성감소대책", "감소대책 실행", "", "", "개선 후 위험성",
    "조문번호", "관련근거\n(법적기준)"
  ]);
  aoa.push([
    "공정명", "위험발생 상황 및 결과", "", "",
    "", "개선 예정일", "개선 완료일", "담당자", "위험성 수준판단", "", ""
  ]);
  // 헤더 병합
  merges.push({ s:{r:3,c:0}, e:{r:3,c:1} });  // 유해위험요인 파악
  merges.push({ s:{r:3,c:2}, e:{r:4,c:2} });  // 현재 안전보건조치
  merges.push({ s:{r:3,c:3}, e:{r:4,c:3} });  // 위험성 수준판단
  merges.push({ s:{r:3,c:4}, e:{r:4,c:4} });  // 위험성감소대책
  merges.push({ s:{r:3,c:5}, e:{r:3,c:7} });  // 감소대책 실행
  merges.push({ s:{r:3,c:9}, e:{r:4,c:9} });  // 조문번호
  merges.push({ s:{r:3,c:10}, e:{r:4,c:10} }); // 관련근거

  // 데이터 행
  var rowIdx = 5; // 0-based, 다음 시작
  (a.units||[]).forEach(function(u){
    var unitStartRow = rowIdx;
    var unitName = u.name;
    if(u.hazards.length === 0){
      aoa.push([unitName, "", "", "", "", "", "", "", "", "", ""]);
      rowIdx++;
    } else {
      u.hazards.forEach(function(h, hi){
        var curRisk = calcRisk(h.probability, h.severity) || "";
        var ctrl = h.controlType ? CTRLS.filter(function(c){return c.id===h.controlType;})[0] : null;
        var measure = (h.measure||"");
        if(ctrl) measure = "[" + ctrl.id + "." + ctrl.name + "] " + measure;
        // 산안법령이 비어 있으면 자동 추론
        var lawN = h.lawNumber || "";
        var lawB = h.lawBasis || "";
        if(!lawN && !lawB){
          var inf = inferLaw(h.category, h.risk);
          lawN = inf.art; lawB = inf.basis;
        }
        aoa.push([
          (hi===0 ? unitName : ""),  // A: 공정명(첫 행만)
          h.risk,                      // B: 위험발생 상황
          h.measure || "",             // C: 현재의 안전보건조치 (KRAS 기본값)
          curRisk,                     // D: 위험성 수준판단
          measure,                     // E: 위험성감소대책
          h.improveStart || "",        // F: 개선 예정일
          h.improveEnd || "",          // G: 개선 완료일
          h.owner || "",               // H: 담당자
          h.afterRisk || "",           // I: 개선 후 위험성
          lawN,                         // J: 조문번호
          lawB                          // K: 관련근거
        ]);
        rowIdx++;
      });
      // 공정명 셀 병합 (단위작업 행 묶음)
      if(u.hazards.length > 1){
        merges.push({ s:{r:unitStartRow,c:0}, e:{r:rowIdx-1,c:0} });
      }
    }
  });

  // 시트 생성
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"] = merges;
  // 컬럼 너비 (업로드 양식과 유사하게)
  ws["!cols"] = [
    { wch: 14 },  // A 공정명
    { wch: 40 },  // B 위험발생 상황
    { wch: 38 },  // C 현재 안전보건조치
    { wch: 10 },  // D 위험성 수준
    { wch: 38 },  // E 감소대책
    { wch: 12 },  // F 예정일
    { wch: 12 },  // G 완료일
    { wch: 10 },  // H 담당자
    { wch: 12 },  // I 개선 후 위험성
    { wch: 16 },  // J 조문번호
    { wch: 32 }   // K 관련근거
  ];
  // 행 높이 (헤더만 약간 높게)
  ws["!rows"] = [
    { hpt: 10 },   // 1
    { hpt: 28 },   // 2 제목
    { hpt: 22 },   // 3 평가대상
    { hpt: 24 },   // 4 헤더
    { hpt: 22 }    // 5 헤더
  ];
  // 셀 스타일은 mini 버전에서 제한적이지만 데이터/병합/너비는 정상

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "위험성평가");
  // 파일명: 위험성평가_현장명_공사_일자.xlsx
  var safeName = (a.siteName || "현장").replace(/[\\\/:*?"<>|]/g, "_");
  var safeProc = procName.replace(/[\\\/:*?"<>|]/g, "_");
  var fname = "위험성평가_" + safeName + "_" + safeProc + "_" + a.date + ".xlsx";
  XLSX.writeFile(wb, fname);
}
function bindSettings(){
  app.querySelectorAll("[data-setting]").forEach(function(el){
    el.addEventListener("input", function(){
      state.settings[el.getAttribute("data-setting")] = el.value;
    });
  });
  var sv = app.querySelector('[data-act="savesettings"]');
  if(sv) sv.addEventListener("click", function(){
    saveSettings(state.settings);
    alert("저장되었습니다.");
    state.view = "home"; render();
  });
  
  // 회사 추가 - 임시로 선택된 타입 보관
  var pendingType = "sub";
  app.querySelectorAll('[data-act="setnewctype"]').forEach(function(el){
    el.addEventListener("click", function(){
      pendingType = el.getAttribute("data-key");
      // 시각적으로 선택 표시
      app.querySelectorAll('[data-act="setnewctype"]').forEach(function(b){
        b.style.background = "#fff";
        b.style.color = b.style.borderColor || "var(--s600)";
      });
      var ti = getCompanyTypeInfo(pendingType);
      el.style.background = ti.color;
      el.style.color = "#fff";
      var label = app.querySelector("#newCompanyTypeSelected");
      if(label) label.innerHTML = "구분 선택: <b style=\"color:" + ti.color + "\">" + ti.label + "</b>";
    });
  });
  var addBtn = app.querySelector('[data-act="addcompany"]');
  if(addBtn) addBtn.addEventListener("click", function(){
    var nameInput = app.querySelector("#newCompanyName");
    var name = (nameInput.value || "").trim();
    if(!name){ alert("회사명을 입력하세요."); return; }
    // 중복 검사
    var existing = state.companies.filter(function(c){ return c.name === name; });
    if(existing.length > 0){ alert("동일한 이름의 회사가 이미 등록되어 있습니다."); return; }
    var company = newCompany(name, pendingType);
    state.companies.push(company);
    saveCompaniesArr(state.companies);
    render();
  });
  app.querySelectorAll('[data-act="delcompany"]').forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-id");
      var c = getCompany(id);
      if(!c) return;
      // 이 회사를 참조하는 평가가 있는지 확인
      var refs = state.assessments.filter(function(a){ return a.companyId === id; }).length;
      var msg = "회사 「" + c.name + "」을(를) 삭제하시겠습니까?";
      if(refs > 0) msg += "\n\n주의: 이 회사로 작성된 평가 " + refs + "건의 회사 참조가 해제됩니다 (평가 자체는 유지).";
      if(!confirm(msg)) return;
      state.companies = state.companies.filter(function(x){return x.id!==id;});
      saveCompaniesArr(state.companies);
      render();
    });
  });
  app.querySelectorAll('[data-act="editcompany"]').forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-id");
      var c = getCompany(id);
      if(!c) return;
      var newName = prompt("회사명 수정:", c.name);
      if(newName === null) return;
      newName = newName.trim();
      if(!newName){ alert("회사명을 입력하세요."); return; }
      c.name = newName;
      saveCompaniesArr(state.companies);
      render();
    });
  });
}

/* ===== PWA ===== */
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredPrompt = e;
  if(state.view==="home") renderHome();
});
function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt = null; if(state.view==="home") renderHome(); });
}
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("risk-sw.js").catch(function(){});
  });
}

/* ===== 시작 ===== */
(function init(){
  try{
    state.settings = loadSettings();
    state.assessments = loadAssess();
    state.companies = loadCompanies();
  }catch(e){
    state.settings = {companyName:"",siteName:"",assessor:""};
    state.assessments = [];
    state.companies = [];
  }
  render();
  /* 클라우드의 이 현장 평가 데이터를 동기화한 뒤 재렌더링 */
  if (typeof dbSyncAll === 'function') {
    dbSyncAll(function (ok) {
      if (!ok) return;
      try {
        state.settings = loadSettings();
        state.assessments = loadAssess();
        state.companies = loadCompanies();
        render();
      } catch (e) {}
    });
  }
})();
</script>
