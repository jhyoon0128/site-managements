<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>산업안전보건관리비 통합 사용내역서</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
        --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s500:#64748b; --s200:#e2e8f0; --s50:#f8fafc;
        --blue:#0284c7; --amber:#f59e0b; --red:#ef4444; --green:#10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: var(--s50); color: var(--s900); padding-bottom: 50px; }
    
    .hdr { background: var(--s900); color: #fff; padding: 20px; display: flex; align-items: center; gap: 15px; }
    .hdr-title { font-size: 20px; font-weight: 700; flex: 1; }
    .back-btn { color: #fff; text-decoration: none; font-size: 24px; }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    
    .card { background: #fff; border: 1px solid var(--s200); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .card-title { font-size: 16px; font-weight: 700; border-bottom: 2px solid var(--s900); padding-bottom: 10px; margin-bottom: 15px; color: var(--s800); }

    /* 입력 폼 스타일 */
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--s700); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--s200); border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-control:focus { border-color: var(--blue); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* 수기 입력창 (기본 숨김, 스크립트로 제어) */
    #inDescCustom { display: none; margin-top: 10px; border: 2px solid var(--amber); background: #fffbeb; }

    .btn-submit { width: 100%; background: var(--blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: #0369a1; }
    .btn-danger { background: var(--red); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }

    /* 데이터 테이블 스타일 */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 13px; }
    th, td { border: 1px solid var(--s200); padding: 10px; text-align: center; }
    th { background: var(--s50); font-weight: 700; color: var(--s700); }
    td.text-left { text-align: left; }
    td.text-right { text-align: right; font-weight: 600; }
</style>
</head>
<body>

<div class="hdr">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="hdr-title">10. 산업안전보건관리비 사용내역</div>
</div>

<div class="container">
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-pen-to-square"></i> 비용 집행 내역 등록</div>
        
        <div class="form-group">
            <label class="form-label">사용 일자</label>
            <input type="date" id="inDate" class="form-control">
        </div>

        <div class="form-group">
            <label class="form-label">항목 분류 (9대 고시 기준 및 기타)</label>
            <select id="inCat" class="form-control">
                <option value="">대분류를 선택하세요</option>
                <option value="1">1. 안전/보건관리자 임금 등</option>
                <option value="2">2. 안전시설비 등</option>
                <option value="3">3. 개인보호구 및 안전장구 구입비 등</option>
                <option value="4">4. 안전보건진단비 등</option>
                <option value="5">5. 안전보건교육비 등</option>
                <option value="6">6. 근로자 건강장해예방비 등</option>
                <option value="7">7. 건설재해예방전문지도기관 기술지도비</option>
                <option value="8">8. 본사 전담조직 근로자 임금 등</option>
                <option value="9">9. 위험성평가 등에 따른 소요비용</option>
                <option value="10">10. 기타 (직접 수기 입력)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">세부 품목 및 내역</label>
            <select id="inSubCat" class="form-control">
                <option value="">대분류를 먼저 선택하세요</option>
            </select>
            <input type="text" id="inDescCustom" class="form-control" placeholder="수기로 세부내역을 정확히 입력해 주세요 (예: 안전화 10켤레)">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">수량</label>
                <input type="number" id="inQty" class="form-control" placeholder="예: 1" value="1">
            </div>
            <div class="form-group">
                <label class="form-label">총 금액 (원)</label>
                <input type="number" id="inAmount" class="form-control" placeholder="예: 50000">
            </div>
        </div>

        <button class="btn-submit" onclick="addExpense()"><i class="fa-solid fa-floppy-disk"></i> 데이터 반영 및 저장</button>
    </div>

    <div class="card">
        <div class="card-title"><i class="fa-solid fa-list"></i> 등록된 세부 집행 내역 (별지)</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>일자</th>
                        <th>항목 분류</th>
                        <th>세부 품목/내역</th>
                        <th>수량</th>
                        <th>금액(원)</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ================= 1. 고시 기준 데이터 매핑 =================
const categoryMapping = {
    1: { name: "1. 안전/보건관리자 임금 등", items: ["안전관리자 인건비", "보건관리자 인건비", "업무수행 출장비", "안전보건보조원 인건비", "기타 (직접 수기 입력)"] },
    2: { name: "2. 안전시설비 등", items: ["안전난간 및 추락방호망", "안전대 부착설비", "안전표지판 및 현수막", "접근통제 설비", "기타 (직접 수기 입력)"] },
    3: { name: "3. 개인보호구 및 안전장구", items: ["안전모", "안전화", "안전대", "보안경 및 방진마스크", "기타 (직접 수기 입력)"] },
    4: { name: "4. 안전보건진단비 등", items: ["안전보건진단비", "작업환경측정비", "특수건강진단비", "기타 (직접 수기 입력)"] },
    5: { name: "5. 안전보건교육비 등", items: ["기초안전보건교육 이수비용", "안전보건교육 교재 및 강사료", "현장 안전조회(TBM) 비품", "기타 (직접 수기 입력)"] },
    6: { name: "6. 근로자 건강장해예방비", items: ["휴게시설 설치 및 유지비", "혹서기 탈수예방 음료/식염포도당", "미세먼지 마스크", "기타 (직접 수기 입력)"] },
    7: { name: "7. 기술지도비", items: ["건설재해예방전문지도기관 기술지도비", "기타 (직접 수기 입력)"] },
    8: { name: "8. 본사 전담조직 근로자 임금", items: ["본사 안전전담조직 인건비", "기타 (직접 수기 입력)"] },
    9: { name: "9. 위험성평가 소요비용", items: ["위험성평가 개선조치 소요비용", "스마트 안전장비 구입/임대비", "기타 (직접 수기 입력)"] }
};

// 페이지 로드 완료 후 스크립트를 실행하여 브라우저 호환성 및 이벤트 누락 방지
document.addEventListener("DOMContentLoaded", function() {
    const inCat = document.getElementById('inCat');
    const inSubCat = document.getElementById('inSubCat');
    const inDescCustom = document.getElementById('inDescCustom');

    // ================= 2. UI 연동: 대분류 선택 시 동작 =================
    inCat.addEventListener('change', function() {
        const val = this.value;
        
        // 상태 초기화
        inSubCat.innerHTML = '<option value="">세부품목을 선택하세요</option>';
        inDescCustom.style.display = 'none';
        inDescCustom.value = '';

        if (val === "10") {
            // [대분류 10번] '기타'를 선택했을 때
            inSubCat.style.display = 'none'; // 세부품목 드롭다운 숨김
            inDescCustom.style.display = 'block'; // 수기입력창 바로 표시
            inDescCustom.focus();
        } else if (val && categoryMapping[val]) {
            // [대분류 1~9번] 정상 선택 시
            inSubCat.style.display = 'block'; // 세부품목 드롭다운 표시
            categoryMapping[val].items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                inSubCat.appendChild(opt);
            });
        } else {
            // 대분류 미선택 시
            inSubCat.style.display = 'block';
            inSubCat.innerHTML = '<option value="">대분류를 먼저 선택하세요</option>';
        }
    });

    // ================= 3. UI 연동: 세부품목 선택 시 동작 =================
    inSubCat.addEventListener('change', function() {
        if (this.value === "기타 (직접 수기 입력)") {
            inDescCustom.style.display = 'block';
            inDescCustom.focus();
        } else {
            inDescCustom.style.display = 'none';
            inDescCustom.value = '';
        }
    });

    // 초기 오늘 날짜 셋팅 및 테이블 렌더링
    document.getElementById('inDate').value = new Date().toISOString().substring(0, 10);
    renderTable();
});

// ================= 4. 데이터 검증 및 저장 로직 =================
function addExpense() {
    const dateStr = document.getElementById('inDate').value;
    const catId = document.getElementById('inCat').value;
    const subCat = document.getElementById('inSubCat').value;
    const customDesc = document.getElementById('inDescCustom').value.trim();
    const qty = parseInt(document.getElementById('inQty').value) || 1;
    const amount = parseInt(document.getElementById('inAmount').value);

    // 필수 입력값 1차 검증
    if (!dateStr || !catId || !amount) {
        alert("일자, 분류, 금액은 필수 입력 항목입니다.");
        return;
    }

    let catName = "";
    let finalDesc = "";

    // 대분류에 따른 조건부 검증
    if (catId === "10") {
        catName = "10. 기타 항목 (수기입력)";
        finalDesc = customDesc;
        if (!finalDesc) {
            alert("기타 항목의 세부 내역을 수기로 입력해 주세요.");
            return;
        }
    } else {
        catName = categoryMapping[catId].name;
        if (subCat === "기타 (직접 수기 입력)") {
            finalDesc = customDesc;
            if (!finalDesc) {
                alert("세부 내역을 수기로 입력해 주세요.");
                return;
            }
        } else {
            finalDesc = subCat;
            if (!finalDesc) {
                alert("세부품목을 선택해 주세요.");
                return;
            }
        }
    }

    // 객체 생성
    const newEntry = {
        id: Date.now(),
        date: dateStr,
        catId: parseInt(catId),
        catName: catName,
        desc: finalDesc,
        qty: qty,
        amount: amount
    };

    // 로컬 스토리지 저장 및 업데이트
    let expenses = JSON.parse(localStorage.getItem('sh_expenses')) || [];
    expenses.push(newEntry);
    localStorage.setItem('sh_expenses', JSON.stringify(expenses));

    // UI 입력창 초기화
    document.getElementById('inAmount').value = '';
    document.getElementById('inQty').value = '1';
    
    if (catId === "10" || subCat === "기타 (직접 수기 입력)") {
        document.getElementById('inDescCustom').value = '';
        document.getElementById('inDescCustom').style.display = 'none';
        if (catId !== "10") document.getElementById('inSubCat').selectedIndex = 0;
    } else {
        document.getElementById('inSubCat').selectedIndex = 0;
    }

    renderTable();
    alert("내역이 성공적으로 저장되었습니다.");
}

// ================= 5. 테이블 렌더링 및 삭제 기능 =================
function deleteExpense(id) {
    if(confirm("정말 이 내역을 삭제하시겠습니까?")) {
        let expenses = JSON.parse(localStorage.getItem('sh_expenses')) || [];
        expenses = expenses.filter(exp => exp.id !== id);
        localStorage.setItem('sh_expenses', JSON.stringify(expenses));
        renderTable();
    }
}

function renderTable() {
    const tbody = document.getElementById('dataTableBody');
    let expenses = JSON.parse(localStorage.getItem('sh_expenses')) || [];
    tbody.innerHTML = '';

    if (expenses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:#94a3b8; padding:20px;">등록된 집행 내역이 없습니다.</td></tr>';
        return;
    }

    // 최신 날짜순 정렬
    const sortedExp = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date));

    sortedExp.forEach(exp => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${exp.date}</td>
            <td class="text-left" style="font-size:12px; color:var(--s500);">${exp.catName}</td>
            <td class="text-left" style="font-weight:600;">${exp.desc}</td>
            <td>${exp.qty}</td>
            <td class="text-right" style="color:var(--blue);">${exp.amount.toLocaleString()}원</td>
            <td><button class="btn-danger" onclick="deleteExpense(${exp.id})"><i class="fa-solid fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
    });
}
</script>
</body>
</html>
